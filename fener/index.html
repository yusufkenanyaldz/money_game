<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050404">
<title>Son Fener</title>
<style>
:root{
  --bg:#050404; --panel:rgba(11,10,9,.95); --line:rgba(216,207,191,.11); --line2:rgba(216,207,191,.26);
  --ink:#d8cfbf; --dim:#837b70; --blood:#b8352a; --gold:#c9a24a; --ember:#e0a050; --cold:#7d9db3;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --pw:0px; --ph:min(41vh,400px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--serif);user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.ru{display:block;overflow:visible}
#top{position:fixed;top:0;left:0;right:var(--pw);padding:calc(10px + env(safe-area-inset-top)) 16px 0;text-align:center;pointer-events:none}
#kor .ki{height:.95em;vertical-align:-.14em;margin-right:10px;filter:drop-shadow(0 0 10px rgba(224,120,40,.5))}
#kor{font-size:clamp(28px,7vw,40px);letter-spacing:.06em;color:#eadfca;text-shadow:0 0 24px rgba(224,160,80,.35),0 2px 6px #000;font-variant-numeric:tabular-nums}
#kor small{font-size:.42em;letter-spacing:.3em;color:var(--ember);margin-left:6px;vertical-align:.5em}
#rate{font-size:13px;color:var(--dim);font-style:italic;margin-top:2px}
#wave{position:relative;width:min(470px,94%);margin:8px auto 0;height:40px}
#wave::after{content:"";position:absolute;inset:0;border-style:solid;border-width:12px 40px;border-image:url(assets/bar.webp) 45 150 fill / 12px 40px stretch;pointer-events:none}
#wave .trk{position:absolute;inset:11px 28px;background:rgba(5,4,3,.92);overflow:hidden}
#waveFill{position:absolute;top:0;bottom:0;left:0;width:0;background:url(assets/bar-dolgu.webp) left center/auto 100%;opacity:.8;transition:width .3s}
#waveTxt{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-size:11.5px;letter-spacing:.08em;white-space:nowrap;text-shadow:0 0 4px #000,0 0 8px #000,0 1px 2px #000}
#wave.warn #waveFill{filter:hue-rotate(-25deg) saturate(1.6) brightness(.85)}
#wave.live .trk{animation:pulse .5s infinite alternate}#wave.live #waveFill{opacity:1}
@keyframes pulse{to{box-shadow:0 0 18px rgba(224,160,80,.5)}}
#gear{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(var(--pw) + 12px);width:34px;height:34px;border:1px solid var(--line2);background:rgba(0,0,0,.5);font-size:15px;color:var(--dim)}
#hint{position:fixed;left:0;right:var(--pw);bottom:calc(var(--ph) + 14px);text-align:center;font-style:italic;color:var(--dim);font-size:14px;letter-spacing:.06em;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 4px #000}
#panel{position:fixed;left:0;right:0;bottom:0;height:var(--ph);display:flex;flex-direction:column;border-style:solid;border-width:40px;border-image:url(assets/panel.webp) 150 fill / 40px / 0 stretch;padding:0 2px calc(env(safe-area-inset-bottom)) ;margin:0 -4px -6px}
#panel{box-shadow:inset 0 0 0 2000px rgba(7,5,4,.5)}
#panel>*{margin:-14px -12px 0}#panel #body{margin:0 -12px -18px}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:12px 2px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;position:relative}
#tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
#tabs button .dot{position:absolute;top:8px;right:18%;width:6px;height:6px;border-radius:50%;background:var(--ember);box-shadow:0 0 8px var(--ember);display:none}
#tabs button.new .dot{display:block}
#body{flex:1;overflow-y:auto;padding:4px 14px 18px;overscroll-behavior:contain}
.mode{display:flex;justify-content:flex-end;gap:4px;padding:8px 0 4px}
.mode button{padding:3px 10px;font-size:11px;letter-spacing:.15em;border:1px solid var(--line);color:var(--dim)}
.mode button.on{border-color:var(--gold);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row .ic:has(img){border:0;background:none}.row .ic img{width:48px;height:auto;filter:drop-shadow(0 2px 4px #000)}
.row .ic{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:2px solid #4a3a2c;box-shadow:0 0 0 1px #120d0a,inset 0 0 12px rgba(0,0,0,.9),0 2px 5px #000;background:radial-gradient(circle,#2a1a10,#0c0806 70%)}
.row .ic svg{width:14px;height:19px}
.row.dark .ic{border-color:#2c3a44;background:radial-gradient(circle,#141a1e,#060708 70%)}
.row .tx{flex:1;min-width:0}
.row .tt{font-size:15.5px;line-height:1.2}
.row .tt i{font-style:normal;font-size:12px;color:var(--gold);margin-left:6px;letter-spacing:.08em}
.row .sb{font-size:12.5px;color:var(--dim);font-style:italic;margin-top:3px;line-height:1.35}
.row .sb b{color:#bfb5a4;font-weight:400;font-style:normal}
.row.dark .tt{color:var(--cold)}
.buy{flex:none;min-width:110px;min-height:46px;padding:4px 10px;border-style:solid;border-width:12px 22px;border-image:url(assets/buton.webp) 50 85 fill / 12px 22px stretch;font-size:13px;text-align:center;line-height:1.2;color:#eadfca;text-shadow:0 1px 3px #000;transition:filter .15s}
.buy:not(:disabled):hover{border-image-source:url(assets/buton-parla.webp)}
.buy:not(:disabled):active{border-image-source:url(assets/buton-bas.webp);transform:translateY(1px)}
.buy small{display:block;font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.buy:disabled{filter:grayscale(.75) brightness(.78);color:#9d9385;cursor:default}
.buy.red:not(:disabled){filter:hue-rotate(170deg) saturate(.6)}
.mystery{padding:14px 4px;color:var(--dim);font-style:italic;font-size:13px;line-height:1.5;border-bottom:1px solid var(--line)}
.mystery b{color:var(--ink);font-weight:400;font-style:normal}
.hd{padding:14px 2px 6px;font-size:13px;line-height:1.55;color:var(--dim);font-style:italic}
.hd b{color:var(--ink);font-style:normal;font-weight:400}
.big{display:block;width:100%;margin:8px 0 6px;padding:8px 14px;border-style:solid;border-width:14px 28px;border-image:url(assets/buton-parla.webp) 55 95 fill / 14px 28px stretch;letter-spacing:.2em;text-transform:uppercase;font-size:12.5px;color:#f0e2c4;text-shadow:0 1px 3px #000}
.big:disabled{border-image-source:url(assets/buton.webp);filter:grayscale(.7) brightness(.6)}
.note{padding:12px 2px;border-bottom:1px solid var(--line)}
.note b{display:block;font-weight:400;font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.note p{font-style:italic;color:#b4ab9b;font-size:14px;line-height:1.5;margin-top:4px}
.note.lock p{color:#4a453e}
#toast{position:fixed;left:50%;top:calc(130px + env(safe-area-inset-top));transform:translate(-50%,-10px);margin-left:calc(var(--pw) / -2);width:min(440px,90vw);text-align:center;opacity:0;transition:opacity .8s,transform .8s;pointer-events:none;
  background:rgba(5,4,4,.82);border-top:1px solid rgba(201,162,74,.4);border-bottom:1px solid rgba(201,162,74,.4);padding:12px 16px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font-weight:400;letter-spacing:.3em;font-size:12px;color:var(--gold);margin-bottom:5px}
#toast p{font-style:italic;font-size:14.5px;line-height:1.5;color:#cfc5b3}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,2,2,.86);padding:18px;z-index:5}
.modal.on{display:flex}
.mbox{width:min(460px,100%);text-align:center;border-style:solid;border-width:44px;border-image:url(assets/panel.webp) 150 fill / 44px / 0 stretch;padding:0 6px}
.mbox h2{font-weight:400;letter-spacing:.28em;font-size:22px;margin-bottom:12px}
.mbox p{color:#a9a090;font-style:italic;line-height:1.6;font-size:14.5px;margin:6px 0}
.mbox p b{color:var(--ink);font-style:normal;font-weight:400}
.mbox .btn{display:inline-block;margin:14px 4px 0;min-width:130px;padding:6px 14px;border-style:solid;border-width:12px 22px;border-image:url(assets/buton.webp) 50 85 fill / 12px 22px stretch;letter-spacing:.2em;text-transform:uppercase;font-size:12px;text-shadow:0 1px 3px #000}
.mbox .btn.pri{border-image-source:url(assets/buton-parla.webp)}
.mbox .stat{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.mbox .stat span{color:var(--dim);font-style:italic}
#veil{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.4s;z-index:6}
#veil.on{opacity:1}
@media (max-width:600px){
  #panel{border-width:26px;border-image-width:26px}
  #panel>*{margin:-8px -6px 0}#panel #body{margin:0 -6px -10px}
  .row{gap:10px;padding:9px 0}.row .tt{font-size:14.5px}.row .sb{font-size:12px}
  .row .ic{width:38px;height:38px}.row .ic img{width:42px}
  .buy{min-width:96px;font-size:12.5px}
  #tabs button{padding:10px 2px;letter-spacing:.16em}
}
@media (min-width:900px){
  :root{--pw:390px;--ph:0px}
  #panel{left:auto;top:0;width:var(--pw);height:auto;margin:0}
  #hint{bottom:40px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div id="kor">0<small>KOR</small></div>
  <div id="rate">fener zayıf yanıyor</div>
  <div id="wave"><div class="trk"><div id="waveFill"></div></div><span id="waveTxt"></span></div>
</div>
<button id="gear" aria-label="Ayarlar">⚙</button>
<div id="hint">Fenere dokun.</div>
<div id="toast"></div>
<div id="panel">
  <div id="tabs">
    <button data-t="fener" class="on">Fener<i class="dot"></i></button>
    <button data-t="yer">Yerler<i class="dot"></i></button>
    <button data-t="run">Rünler<i class="dot"></i></button>
    <button data-t="gunce">Günce<i class="dot"></i></button>
  </div>
  <div id="body"></div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="veil"></div>

<script>
'use strict';
/* =========================================================
   SON FENER — karanlık fantastik idle oyun
   Tek dosya, bağımlılıksız, sıfır dış istek.
   ========================================================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(Math.random()*a.length)|0];

/* ---------- SAYI / ZAMAN ---------- */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n))return'∞';
  if(n<1000)return n<10?String(Math.floor(n*10)/10).replace('.',','):String(Math.floor(n));
  let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++;}
  return(n<10?n.toFixed(2):n<100?n.toFixed(1):String(Math.floor(n))).replace('.',',')+SUF[i];
}
function fmtT(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}
function fmtLong(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} saat ${m} dakika`:m?`${m} dakika`:`${Math.floor(s)} saniye`;}

/* ---------- RÜN İKONLARI ---------- */
const RUNES={
  fehu:[[3,1,3,13],[3,4,8,1],[3,7,8,4]],uruz:[[2,13,2,1,8,4,8,13]],thurisaz:[[3,1,3,13],[3,4,7,7,3,10]],
  ansuz:[[3,1,3,13],[3,1,8,4],[3,5,8,8]],raidho:[[3,13,3,1,7,4,3,7,8,13]],kenaz:[[7,2,3,7,7,12]],
  gebo:[[2,2,8,12],[8,2,2,12]],wunjo:[[3,13,3,1,7,4,3,7]],hagalaz:[[2,1,2,13],[8,1,8,13],[2,5,8,9]],
  naudiz:[[5,1,5,13],[2,5,8,9]],isa:[[5,1,5,13]],jera:[[4,3,1,6,4,9],[6,5,9,8,6,11]],
  eihwaz:[[5,1,5,13],[5,1,8,4],[5,13,2,10]],perthro:[[7,1,3,4,3,10,7,13]],algiz:[[5,1,5,13],[5,6,1,1],[5,6,9,1]],
  sowilo:[[7,1,3,5,7,9,3,13]],tiwaz:[[5,1,5,13],[5,1,1,5],[5,1,9,5]],berkano:[[3,13,3,1,7,4,3,7,7,10,3,13]],
  ehwaz:[[2,13,2,1,5,5,8,1,8,13]],mannaz:[[2,13,2,1,8,7],[8,13,8,1,2,7]],laguz:[[3,13,3,1,8,5]],
  ingwaz:[[5,2,9,7,5,12,1,7,5,2]],dagaz:[[2,2,2,12,8,2,8,12,2,2]],othala:[[2,13,8,5,5,1,2,5,8,13]],
};
function icon(k,col){
  const d=(RUNES[k]||RUNES.isa).map(p=>'M'+p[0]+' '+p[1]+p.slice(2).reduce((s,v,i)=>s+(i%2?' ':' L')+v,'')).join(' ');
  return `<svg class="ru" viewBox="-1 -1 12 16"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.35" stroke-linecap="square"/></svg>`;
}

/* ---------- TANIMLAR ---------- */
const LOCS=[
  {kind:'hut',d:1.5,base:.6,cost:10,rune:'berkano',names:['Odun Kulübesi','Avcı Barınağı','Terk Edilmiş Ahır'],note:'Kapı içeriden kilitliydi. Ocakta hâlâ ılık kül vardı.'},
  {kind:'well',d:4,base:4,cost:120,rune:'laguz',names:['Taş Kuyu','Kuru Çeşme','Kör Pınar'],note:'Aşağı bir taş attım. Ses gelmedi. Bir süre sonra taş geri geldi.'},
  {kind:'grave',d:8,base:22,cost:1500,rune:'eihwaz',names:['Mezarlık','Kemik Tarlası','Sessiz Höyük'],note:'Toprak yeni kazılmış. İçeriden değil, dışarıdan.'},
  {kind:'mill',d:14,base:120,cost:2e4,rune:'jera',names:['Değirmen','Tuz Ambarı','Yıkık Han'],note:'Duvara biri çentikler kazımış. Her gün bir çentik eksilmiş.'},
  {kind:'mine',d:22,base:700,cost:3e5,rune:'perthro',names:['Maden','Taş Ocağı','Derin Mağara'],note:'Madenciler aşağıda bir şey duyduklarını söylemiş. Sonra hepsi aşağı inmiş.'},
  {kind:'abbey',d:33,base:4000,cost:5e6,rune:'ansuz',names:['Manastır','Unutulmuş Tapınak','Keşiş Hücreleri'],note:'Keşişler ışığı saklamış. Karanlıktan değil, karanlık için.'},
  {kind:'tower',d:47,base:25000,cost:8e7,rune:'tiwaz',names:['Gözcü Kulesi','Kurt Kalesi','Yıkık Burç'],note:'Kuleden baktım: karanlığın da bir kıyısı var. Biri orada bekliyor.'},
  {kind:'cathedral',d:64,base:150000,cost:1.4e9,rune:'ingwaz',names:['Katedral','Kral Mezarı','Kristal Salon'],note:'Duvar resimlerinde hep aynı fener var. Ve onu hep aynı el tutuyor.'},
  {kind:'gate',d:85,base:1e6,cost:2.5e10,rune:'dagaz',names:['Uçurum Kapısı'],note:'Kapının ardında karanlık yok. Söndürülmüş bin fener var. Benimki de bir gün aralarında olacak.'},
];
const MILES=[10,25,50,100,150,200,300,400];
const RUNE_UP={
  fehu:{n:'Fehu',d:'+%50 kor üretimi',base:2},
  uruz:{n:'Uruz',d:'Dokunuş gücü iki katı',base:1},
  algiz:{n:'Algiz',d:'+%30 savunma',base:2},
  kenaz:{n:'Kenaz',d:'Dalgalar 10 saniye geç gelir',base:3,max:6},
  jera:{n:'Jera',d:'Dalgalar daha yavaş güçlenir',base:5,max:6},
  sowilo:{n:'Sowilo',d:'Savuşturulan dalganın ödülü iki katı',base:3},
  raidho:{n:'Raidho',d:'Her yeni tura +2 fitille başla',base:3,max:5},
  othala:{n:'Othala',d:'Yer maliyetleri −%5',base:4,max:6},
  laguz:{n:'Laguz',d:'Çevrimdışı verim +%10',base:2,max:5},
};
const KUL_REQ=3;

/* ---------- KAYIT ---------- */
const KEY='sonfener_v1';
let S=null;
function freshSave(){return{kor:0,total:0,life:0,kul:0,kulTotal:0,runes:{},notes:[],runs:0,mute:false,last:Date.now(),taps:0,held:0,fell:0,run:null};}
function newRun(){
  const off=Math.random()*TAU;
  S.run={fitil:(S.runes.raidho||0)*2,sur:0,cam:0,waveN:0,waveT:interval(),phase:'calm',live:0,boost:0,
    locs:LOCS.map((L,i)=>({lv:0,dark:false,ang:off+i*2.39996+rnd(-.25,.25),name:pick(L.names)}))};
  genProps();S.kor=0;S.total=0;
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.run)return s;}catch(e){}
  return null;
}
function persist(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- FORMÜLLER ---------- */
const rl=k=>S.runes[k]||0;
const R=()=>{const L=S.run.fitil;return 1+L*1.2+L*L*.06;};
const revealed=i=>LOCS[i].d<=R();
const mile=lv=>{let m=1;for(const x of MILES)if(lv>=x)m*=2;return m;};
const nextMile=lv=>MILES.find(x=>x>lv);
const gmult=()=>(1+.5*rl('fehu'))*(1+.03*S.kul);
function locProd(i,lv){const l=S.run.locs[i];lv=lv??l.lv;if(!revealed(i)||l.dark||lv<=0)return 0;return LOCS[i].base*lv*mile(lv)*gmult();}
function prod(){let s=0;for(let i=0;i<LOCS.length;i++)s+=locProd(i);return s;}
const locCost=(i,lv)=>LOCS[i].cost*Math.pow(1.15,lv)*(1-.05*rl('othala'));
function bulk(i,n){let c=0,lv=S.run.locs[i].lv;for(let k=0;k<n;k++)c+=locCost(i,lv+k);return c;}
function maxBuy(i){let c=0,n=0,lv=S.run.locs[i].lv;while(n<1000){const x=locCost(i,lv+n);if(c+x>S.kor)break;c+=x;n++;}return[n,c];}
const fitilCost=()=>15*Math.pow(2,S.run.fitil-(rl('raidho')*2));
const surCost=()=>25*Math.pow(1.55,S.run.sur);
const camCost=()=>20*Math.pow(1.8,S.run.cam);
const defBase=s=>(s===0?8:12*Math.pow(1.4,s))*(1+.3*rl('algiz'));
const defense=()=>defBase(S.run.sur)*(1+S.run.boost);
const interval=()=>80+10*rl('kenaz');
const waveStr=n=>6*Math.pow(1.32-.01*rl('jera'),n)*(1+R()*.04);
const tapGain=()=>(1+S.run.cam)*Math.pow(2,rl('uruz'))+prod()*.02*(1+S.run.cam*.15);
const kulGain=()=>Math.floor(Math.sqrt(S.total/1e5));
const offEff=()=>.5+.1*rl('laguz');
const runeCost=k=>Math.ceil(RUNE_UP[k].base*Math.pow(1.8,rl(k)));

/* ---------- SES ---------- */
let AC=null,master=null,nb=null;
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);
    nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function tone(f,dur,type,vol,delay,slide){const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.08,dur/4));g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,delay){const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type='lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
let lastTap=0;
function sfx(n){if(!AC||S.mute)return;
  switch(n){
    case'tap':{const now=AC.currentTime;if(now-lastTap<.04)return;lastTap=now;noise(.12,.12,2200);tone(140+Math.random()*40,.12,'sine',.05);break;}

  // fener ve kıvılcımlar

  for(const o of run.props||[]){if(o.d>Rw*1.08)continue;const P=PROP[o.k];if(!P.lit&&!P.rune)continue;const [x,y]=propPos(o,cx,cy),h=ps*P.h,g=h*(P.rune?.9:.7)*(.9+.1*Math.sin(t*11+o.a*5));
    ctx.globalAlpha=P.rune?.35+.15*Math.sin(t*1.7+o.a):.55;ctx.drawImage(glow(P.rune?'#e0a050':'#ffb060'),x-g/2,y-h*(P.rune?.55:.88)-g/2,g,g);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(ok('fener')){const im=IMG.fener,h=clamp(zoom*1.75,64,120),w=h*im.width/im.height,top=cy-h*.56+Math.sin(t*1.2)*1.2;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.ellipse(cx,top+h*.99,w*.42,h*.05,0,0,TAU);ctx.fill();
    ctx.drawImage(im,cx-w/2,top,w,h);
    ctx.globalCompositeOperation='lighter';const g=h*(.85+.25*flare);ctx.globalAlpha=.28+.3*(fl-.9)*4;ctx.drawImage(glow('#e0a050'),cx-g/2,top+h*.6-g/2,g,g);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  else drawLantern(cx,cy,clamp(zoom*.7,26,48),fl,t);
  ctx.globalCompositeOperation='lighter';
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.l-=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy-=30*.016;if(p.l<=0){sparks.splice(i,1);continue;}

    ctx.globalAlpha=Math.min(1,f.l*2);ctx.font=`${f.s||14}px Georgia,serif`;ctx.fillStyle=f.c||'#e8cfa0';ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=3;ctx.strokeText(f.t,f.x,f.y);ctx.fillText(f.t,f.x,f.y);}
  ctx.globalAlpha=1;
  // çerçeve
  const v=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.3,cx,cy,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);

}

/* ---------- OYUN MANTIĞI ---------- */
function gain(n){S.kor+=n;S.total+=n;S.life+=n;}
function tick(dt){
  const run=S.run;
  gain(prod()*dt);
  if(run.phase==='calm'){
    const before=run.waveT;run.waveT-=dt;
    if(before>10&&run.waveT<=10)sfx('warn');
    if(run.waveT<=0){run.phase='wave';run.live=4;run.boost=0;startTendrils();}
  }else if(run.phase==='wave'){
    run.live-=dt;if(run.live<=0)resolveWave(false);
  }
  checkReveal();
}
function startTendrils(){
  const W0=waveStr(S.run.waveN),D=defense();const force=clamp(W0/D,0.4,1.6);
  tendr=Array.from({length:16},(_,i)=>({a:i/16*TAU+rnd(-.2,.2),c:rnd(-.5,.5),w:rnd(8,22),p:0,v:rnd(.25,.45),force}));
}
function resolveWave(offline,noEsc){
  const run=S.run,W0=waveStr(run.waveN),D=defense(),r={held:D>=W0,lost:[],healed:null,reward:0};
  if(r.held){
    r.reward=offline?0:prod()*15*(1+rl('sowilo'));gain(r.reward);S.held++;
    const dk=run.locs.map((l,i)=>i).filter(i=>run.locs[i].dark).sort((a,b)=>LOCS[a].d-LOCS[b].d);
    if(dk.length){run.locs[dk[0]].dark=false;r.healed=run.locs[dk[0]].name;}
  }else{
    S.fell++;
    const lit=run.locs.map((l,i)=>i).filter(i=>revealed(i)&&run.locs[i].lv>0&&!run.locs[i].dark).sort((a,b)=>LOCS[b].d-LOCS[a].d);
    const n=Math.max(1,Math.ceil(lit.length*Math.min(1,(W0-D)/W0*1.5)));
    for(const i of lit.slice(0,n)){run.locs[i].dark=true;r.lost.push(run.locs[i].name);}
  }
  if(!noEsc)run.waveN++;run.phase='calm';run.waveT=interval();run.boost=0;
  if(!offline){
    if(r.held){sfx('held');flare=1;const [cx,cy]=center();floats.push({x:cx,y:cy-60,t:'Gece savuşturuldu  +'+fmt(r.reward),l:2.4,s:15,c:'#e8cfa0'});
      if(r.healed)toast('IŞIK GERİ GELDİ',`${r.healed} yeniden yanıyor.`);}
    else{sfx('fell');shrink=1;shrinkT=1.2;if(r.lost.length)toast('KARANLIK İLERLEDİ',`${r.lost.join(', ')} söndü.`);}
    dirty=true;
  }
  return r;
}
let knownRevealed=-1;
function checkReveal(){
  let n=0;for(let i=0;i<LOCS.length;i++)if(revealed(i))n=i+1;
  if(knownRevealed<0){knownRevealed=n;return;}
  if(n>knownRevealed){
    for(let i=knownRevealed;i<n;i++){const l=S.run.locs[i];sfx('reveal');
      if(!S.notes.includes(i)){S.notes.push(i);markTab('gunce');}
      toast(l.name.toLocaleUpperCase('tr-TR'),LOCS[i].note);}
    knownRevealed=n;markTab('yer');dirty=true;
  }
}
function tap(x,y){
  audio();const run=S.run;
  if(run.phase==='wave'){run.boost=Math.min(.6,run.boost+.03);floats.push({x,y:y-10,t:'+%3 ışık',l:.8,s:13,c:'#e0a050'});}
  const g=tapGain();gain(g);S.taps++;flare=Math.min(1,flare+.35);
  if(run.phase!=='wave')floats.push({x:x+rnd(-10,10),y:y-10,t:'+'+fmt(g),l:.9});
  const [cx,cy]=center();for(let i=0;i<6;i++)sparks.push({x:cx+rnd(-4,4),y:cy-4,vx:rnd(-50,50),vy:rnd(-90,-30),l:rnd(.6,1.1)});
  sfx('tap');
  if(S.taps>3)$('#hint').style.opacity=0;
}
cv.addEventListener('pointerdown',e=>tap(e.clientX,e.clientY));

/* ---------- ÇEVRİMDIŞI ---------- */
function offline(){
  let el=Math.min(8*3600,(Date.now()-S.last)/1000);
  if(el<60)return;
  const run=S.run,rep={el,gained:0,held:0,fell:0,lost:new Set()};
  if(run.phase==='wave')resolveWave(true);
  let guard=0;
  while(el>0&&guard++<600){
    const step=Math.min(el,run.waveT);
    const g=prod()*step*offEff();gain(g);rep.gained+=g;
    el-=step;run.waveT-=step;
    if(run.waveT<=0){const r=resolveWave(true,true);if(r.held)rep.held++;else{rep.fell++;r.lost.forEach(n=>rep.lost.add(n));}}
  }
  const lostNow=run.locs.filter(l=>l.dark).map(l=>l.name);
  modal(`<h2>SEN YOKKEN</h2>
    <p>${fmtLong(rep.el)} geçti. Fener %${Math.round(offEff()*100)} güçle yanmayı sürdürdü. Gece sen yokken güçlenmez; ama savunman yetmezse her gece bir yer daha söner.</p>
    <div class="stat"><span>Toplanan kor</span>${fmt(rep.gained)}</div>
    <div class="stat"><span>Savuşturulan gece</span>${rep.held}</div>
    <div class="stat"><span>Kaybedilen gece</span>${rep.fell}</div>
    ${lostNow.length?`<p>Karanlıkta kalanlar: <b>${lostNow.join(', ')}</b></p>`:rep.fell?'<p>Düşenler sonradan yeniden yandı.</p>':'<p>Hiçbir yer düşmedi.</p>'}
    <button class="btn pri" data-close>Devam</button>`);
}
