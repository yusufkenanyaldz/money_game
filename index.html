<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MİDAS — Dokun, Altına Çevir</title>
<style>
  :root{
    --gold:#ffd24a;
    --gold-deep:#f5a623;
    --bg0:#0a0812;
    --bg1:#160e26;
    --danger:#ff3b6b;
    --cyan:#38f9d7;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;
    touch-action:manipulation;overscroll-behavior:none;}
  #game{position:fixed;inset:0;display:block;}
  canvas{display:block;width:100%;height:100%;}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .top{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;padding:0 22px;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .label{font-size:11px;letter-spacing:2px;color:#8a7fb0;text-transform:uppercase;font-weight:700;}
  .stat.right{align-items:flex-end;}
  #money{font-size:34px;font-weight:900;color:var(--gold);
    text-shadow:0 0 22px rgba(255,210,74,.55);font-variant-numeric:tabular-nums;line-height:1;}
  #best{font-size:20px;font-weight:800;color:#cbb9ff;font-variant-numeric:tabular-nums;line-height:1;}

  /* center multiplier */
  #combo{position:absolute;top:16%;left:0;right:0;text-align:center;
    font-size:15vw;font-weight:900;color:#fff;opacity:0;
    text-shadow:0 0 40px rgba(255,210,74,.7);line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-2px;}

  /* floating "PERFECT!" popups handled on canvas; this is the streak label */
  #streak{position:absolute;top:calc(16% + 15vw);left:0;right:0;text-align:center;
    font-size:14px;font-weight:800;letter-spacing:4px;color:var(--gold);opacity:0;text-transform:uppercase;}

  /* ---- Overlays ---- */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;pointer-events:auto;z-index:10;
    background:radial-gradient(120% 90% at 50% 40%, rgba(22,14,38,.35), rgba(10,8,18,.92));
    backdrop-filter:blur(2px);}
  .hidden{display:none !important;}
  .logo{font-size:19vw;font-weight:900;letter-spacing:-4px;line-height:.8;
    background:linear-gradient(180deg,#fff 0%,var(--gold) 55%,var(--gold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,180,60,.45));margin-bottom:6px;}
  .tag{font-size:15px;letter-spacing:5px;color:#b9a8ef;text-transform:uppercase;font-weight:700;margin-bottom:38px;}
  .cta{font-size:16px;color:#d9ceff;font-weight:700;line-height:1.7;max-width:320px;}
  .cta b{color:var(--gold);}
  .pulse-btn{margin-top:34px;pointer-events:auto;
    padding:18px 54px;border:none;border-radius:100px;cursor:pointer;
    font-size:20px;font-weight:900;letter-spacing:1px;color:#3a2600;
    background:linear-gradient(180deg,#ffe27a,var(--gold-deep));
    box-shadow:0 10px 0 #a9660d, 0 18px 40px rgba(245,166,35,.5);
    animation:bob 1.6s ease-in-out infinite;transition:transform .06s;}
  .pulse-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #a9660d,0 8px 20px rgba(245,166,35,.4);}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* game over */
  #go-title{font-size:12vw;font-weight:900;letter-spacing:-2px;color:#fff;line-height:.9;}
  #go-sub{font-size:15px;letter-spacing:4px;color:var(--danger);text-transform:uppercase;font-weight:800;margin-top:6px;}
  .score-box{margin:34px 0 6px;}
  #go-money{font-size:22vw;font-weight:900;color:var(--gold);line-height:.9;
    text-shadow:0 0 50px rgba(255,210,74,.5);font-variant-numeric:tabular-nums;}
  .go-labels{display:flex;gap:26px;justify-content:center;margin-top:14px;}
  .go-labels .gl{display:flex;flex-direction:column;gap:3px;}
  .go-labels .glv{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;}
  .go-labels .gll{font-size:11px;letter-spacing:2px;color:#8a7fb0;text-transform:uppercase;font-weight:700;}
  #newbest{margin-top:16px;font-size:16px;font-weight:900;letter-spacing:3px;color:#3a2600;
    background:var(--gold);padding:8px 20px;border-radius:100px;text-transform:uppercase;
    display:inline-block;animation:flash 0.7s steps(2) infinite;}
  @keyframes flash{50%{opacity:.35}}
  .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:0;right:0;text-align:center;
    font-size:12px;letter-spacing:2px;color:#5f5680;font-weight:600;}
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="top">
      <div class="stat">
        <span class="label">Altın</span>
        <span id="money">0</span>
      </div>
      <div class="stat right">
        <span class="label">Rekor</span>
        <span id="best">0</span>
      </div>
    </div>
    <div id="combo">x2</div>
    <div id="streak">SERİ</div>
  </div>

  <!-- Start -->
  <div class="overlay" id="startScreen">
    <div class="logo">MİDAS</div>
    <div class="tag">Dokun · Altına Çevir</div>
    <div class="cta">Kıvılcım <b>altın kapıdan</b> geçerken dokun.<br>Tam ortası <b>PERFECT</b>. Işkalarsan biter.</div>
    <button class="pulse-btn" id="startBtn">BAŞLA</button>
    <div class="hint">Dokun · Tıkla · Boşluk tuşu</div>
  </div>

  <!-- Game Over -->
  <div class="overlay hidden" id="overScreen">
    <div id="go-title">SONA GELDİN</div>
    <div id="go-sub">Işkaladın</div>
    <div class="score-box">
      <div id="go-money">0</div>
    </div>
    <div class="go-labels">
      <div class="gl"><span class="glv" id="go-hits" style="color:var(--cyan)">0</span><span class="gll">Vuruş</span></div>
      <div class="gl"><span class="glv" id="go-best" style="color:#cbb9ff">0</span><span class="gll">Rekor</span></div>
    </div>
    <div id="newbest" style="display:none">YENİ REKOR!</div>
    <button class="pulse-btn" id="retryBtn">TEKRAR</button>
    <div class="hint">Dokun · Tıkla · Boşluk tuşu</div>
  </div>

<script>
"use strict";
(function(){
/* =========================================================================
   MİDAS  —  tek dokunuşluk refleks oyunu
   Tasarım: kıvılcım çember üzerinde döner, altın kapının içindeyken dokun.
   Odak: "game feel" / juice — hit-stop, ekran sarsıntısı, parçacık, ses, titreşim.
   Tek dosya, bağımlılıksız. Canvas + WebAudio.
   ========================================================================= */

  // ---- Canvas kurulumu ----
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0, H=0, DPR=1, CX=0, CY=0, R=0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H/2;
    R = Math.min(W,H) * 0.30;           // oyun çemberi yarıçapı
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Yardımcılar ----
  const TAU = Math.PI*2;
  const rand = (a,b)=> a + Math.random()*(b-a);
  const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
  // en kısa açısal fark [-PI, PI]
  function angDiff(a,b){ let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }

  // ---- WebAudio (prosedürel ses, dosya yok) ----
  let AC=null;
  function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(freq, dur, type, vol, glideTo){
    const ac = audio(); if(!ac) return;
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, ac.currentTime+dur);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.25, ac.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur+0.02);
  }
  // yükselen combo tınısı — pentatonik merdiven
  const SCALE=[0,3,5,7,10,12,15,17,19,22,24];
  function hitSound(streak){
    const step = SCALE[Math.min(streak, SCALE.length-1)];
    const f = 330 * Math.pow(2, step/12);
    beep(f, 0.18, 'triangle', 0.3);
    beep(f*2, 0.12, 'sine', 0.12);
  }
  function perfectSound(streak){
    const step = SCALE[Math.min(streak, SCALE.length-1)];
    const f = 440 * Math.pow(2, step/12);
    beep(f, 0.22, 'square', 0.14);
    beep(f*1.5, 0.28, 'triangle', 0.22);
    beep(f*2, 0.3, 'sine', 0.16, f*2.02);
  }
  function failSound(){
    beep(180, 0.5, 'sawtooth', 0.28, 40);
    beep(90, 0.6, 'triangle', 0.2, 30);
  }
  function cashSound(){ // oyun başı
    beep(523,0.1,'triangle',0.2); setTimeout(()=>beep(659,0.1,'triangle',0.2),70); setTimeout(()=>beep(880,0.16,'triangle',0.24),140);
  }
  function vibe(ms){ if(navigator.vibrate){ try{navigator.vibrate(ms);}catch(e){} } }

  // ---- Oyun durumu ----
  const STATE = { MENU:0, PLAY:1, OVER:2 };
  let state = STATE.MENU;

  let g = null;
  function newGame(){
    g = {
      angle: 0,              // kıvılcımın açısı
      dir: 1,                // dönüş yönü
      speed: 1.7,            // rad/sn
      gateCenter: -Math.PI/2,// altın kapının merkez açısı (tepede başla)
      gateHalf: 0.62,        // kapı yarı genişliği (rad)
      money: 0,
      hits: 0,
      streak: 0,             // ardışık PERFECT serisi
      mult: 1,
      shake: 0,
      flash: 0,
      hitstop: 0,            // saniye — mikro donma
      pulse: 0,              // çember nabzı
      gatePop: 0,            // yeni kapı doğuş animasyonu
      ringColor: [255,210,74],
      over: false
    };
  }

  // ---- Parçacıklar ----
  const parts = [];
  function burst(x,y,n,opt){
    opt=opt||{};
    for(let i=0;i<n;i++){
      const a = opt.dir!=null ? opt.dir + rand(-opt.spread||-0.9, opt.spread||0.9) : rand(0,TAU);
      const sp = rand(opt.smin||60, opt.smax||420);
      parts.push({
        x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (opt.up||0),
        life:1, decay:rand(0.6,1.5),
        size:rand(opt.smin2||2, opt.smax2||6),
        color: opt.color || [255,210,74],
        grav: opt.grav!=null?opt.grav:900,
        shape: opt.shape||'coin', spin:rand(0,TAU), vspin:rand(-12,12)
      });
    }
  }
  function ring(x,y,color){ // genişleyen halka
    parts.push({ring:true,x,y,r:8,vr:rand(500,760),life:1,decay:2.2,color:color||[255,210,74],lw:rand(3,6)});
  }
  function updateParts(dt){
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i];
      p.life -= p.decay*dt;
      if(p.life<=0){ parts.splice(i,1); continue; }
      if(p.ring){ p.r += p.vr*dt; p.vr*=0.92; continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt; p.vx*=0.99; p.spin+=p.vspin*dt;
    }
  }
  function drawParts(){
    for(const p of parts){
      const a = clamp(p.life,0,1);
      if(p.ring){
        ctx.strokeStyle=`rgba(${p.color[0]},${p.color[1]},${p.color[2]},${a*0.8})`;
        ctx.lineWidth=p.lw*a; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke();
        continue;
      }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin);
      ctx.globalAlpha=a;
      if(p.shape==='coin'){
        const w=p.size, h=p.size*(0.4+0.6*Math.abs(Math.cos(p.spin))); // 3B madeni para hissi
        ctx.fillStyle=`rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
        ctx.beginPath(); ctx.ellipse(0,0,w,h,0,0,TAU); ctx.fill();
      }else{
        ctx.fillStyle=`rgb(${p.color[0]},${p.color[1]},${p.color[2]})`;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      }
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }

  // ---- Kayan yazılar (PERFECT! vb.) ----
  const floats=[];
  function floatText(txt,x,y,color,size){
    floats.push({txt,x,y,color:color||'#ffd24a',size:size||34,life:1,vy:-70});
  }
  function updateFloats(dt){
    for(let i=floats.length-1;i>=0;i--){
      const f=floats[i]; f.life-=dt*1.1; f.y+=f.vy*dt; f.vy*=0.94;
      if(f.life<=0) floats.splice(i,1);
    }
  }
  function drawFloats(){
    for(const f of floats){
      const a=clamp(f.life,0,1);
      const pop = f.life>0.8 ? 1+(f.life-0.8)*3 : 1; // doğuş sıçraması
      ctx.save(); ctx.translate(f.x,f.y); ctx.scale(pop,pop);
      ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`900 ${f.size}px -apple-system,Segoe UI,Roboto,sans-serif`;
      ctx.lineWidth=6; ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.strokeText(f.txt,0,0);
      ctx.fillStyle=f.color; ctx.fillText(f.txt,0,0);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }

  // ---- HUD elemanları ----
  const el = {
    money:document.getElementById('money'), best:document.getElementById('best'),
    combo:document.getElementById('combo'), streak:document.getElementById('streak'),
    start:document.getElementById('startScreen'), over:document.getElementById('overScreen'),
    goMoney:document.getElementById('go-money'), goHits:document.getElementById('go-hits'),
    goBest:document.getElementById('go-best'), newbest:document.getElementById('newbest'),
    goTitle:document.getElementById('go-title'),
  };

  let best = 0;
  try{ best = parseInt(localStorage.getItem('midas_best')||'0',10)||0; }catch(e){}
  el.best.textContent = best;

  function showCombo(mult){
    el.combo.textContent = 'x'+mult;
    el.combo.style.transition='none'; el.combo.style.opacity='1';
    el.combo.style.transform='scale(1.4)';
    el.streak.style.transition='none'; el.streak.style.opacity='1';
    // reflow
    void el.combo.offsetWidth;
    el.combo.style.transition='opacity .5s, transform .3s';
    el.combo.style.transform='scale(1)';
    el.combo.style.opacity='0';
    el.streak.style.transition='opacity .6s'; el.streak.style.opacity='0';
  }

  // ---- Giriş ----
  function press(){
    const ac=audio(); if(ac && ac.state==='suspended') ac.resume();
    if(state===STATE.MENU){ start(); return; }
    if(state===STATE.OVER){ if(overCooldown<=0) start(); return; }
    if(state===STATE.PLAY) tap();
  }
  canvas.addEventListener('pointerdown', (e)=>{ e.preventDefault(); press(); }, {passive:false});
  document.getElementById('startBtn').addEventListener('pointerdown',(e)=>{e.preventDefault();e.stopPropagation();press();});
  document.getElementById('retryBtn').addEventListener('pointerdown',(e)=>{e.preventDefault();e.stopPropagation();press();});
  window.addEventListener('keydown',(e)=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); }});

  let overCooldown = 0;

  function start(){
    newGame();
    state = STATE.PLAY;
    el.start.classList.add('hidden');
    el.over.classList.add('hidden');
    el.money.textContent='0';
    cashSound(); vibe(20);
  }

  function tap(){
    if(g.over) return;
    // kıvılcımın kapı merkezine olan açısal uzaklığı
    const d = Math.abs(angDiff(g.angle, g.gateCenter));
    if(d <= g.gateHalf){
      // VURUŞ
      const perfectZone = g.gateHalf * 0.34;
      const perfect = d <= perfectZone;
      onHit(perfect, d);
    }else{
      onMiss();
    }
  }

  function pos(angle){ return [CX + Math.cos(angle)*R, CY + Math.sin(angle)*R]; }

  function onHit(perfect, d){
    g.hits++;
    const [px,py] = pos(g.angle);

    if(perfect){
      g.streak++;
      g.mult = 1 + g.streak;                 // seri çarpanı büyür
    }else{
      g.streak = 0;
      g.mult = 1;
    }
    const gain = (perfect ? 10 : 5) * g.mult;
    g.money += gain;
    el.money.textContent = g.money;

    // ---- JUICE ----
    g.flash = perfect ? 0.85 : 0.4;
    g.shake = perfect ? 16 : 8;
    g.hitstop = perfect ? 0.09 : 0.05;       // hit-stop: kısa donma
    g.pulse = 1;
    g.ringColor = perfect ? [255,235,120] : [255,210,74];

    const col = perfect ? [255,235,130] : [255,200,70];
    burst(px,py, perfect?34:18, {color:col, smax:perfect?560:380, grav:1100, up:120});
    ring(px,py, col);
    if(perfect) ring(CX,CY,[255,235,130]);

    floatText('+'+gain, px, py-24, perfect?'#fff5c8':'#ffd24a', perfect?40:30);
    if(perfect){
      floatText(g.streak>=3? 'MÜKEMMEL x'+g.mult : 'PERFECT!', CX, CY - R - 42, '#ffe27a', 34);
      showCombo(g.mult);
      perfectSound(g.streak);
      vibe([0,18,25,18]);
    }else{
      hitSound(g.hits);
      vibe(14);
    }

    // ---- Zorluk artışı + yeni kapı ----
    g.speed = Math.min(g.speed + 0.14, 8.5);          // hız yükselir
    g.gateHalf = Math.max(g.gateHalf * 0.965, 0.20);  // kapı daralır
    // yeni kapıyı kıvılcımdan uzağa, rastgele yerleştir
    let ng;
    do{ ng = rand(0,TAU); }while(Math.abs(angDiff(ng, g.angle)) < 1.1);
    g.gateCenter = ng;
    g.gatePop = 1;
    // her 5 vuruşta bir yön değiştir (ekstra baharat)
    if(g.hits % 5 === 0){ g.dir *= -1; floatText('YÖN!', CX, CY+R+50, '#38f9d7', 26); }
  }

  function onMiss(){
    g.over = true;
    state = STATE.OVER;
    g.shake = 26; g.flash = 0.5; g.hitstop = 0.12;
    const [px,py]=pos(g.angle);
    burst(px,py, 26, {color:[255,60,110], smax:520, grav:1200});
    ring(CX,CY,[255,60,110]);
    failSound(); vibe([0,40,30,80]);

    // rekor
    let isBest=false;
    if(g.money > best){ best=g.money; isBest=true; try{localStorage.setItem('midas_best',String(best));}catch(e){} }
    el.best.textContent = best;

    // game over ekranını hafif gecikmeyle göster (dramatik)
    overCooldown = 0.75;
    setTimeout(()=>{
      el.goMoney.textContent = g.money;
      el.goHits.textContent = g.hits;
      el.goBest.textContent = best;
      el.newbest.style.display = isBest ? 'inline-block' : 'none';
      el.goTitle.textContent = isBest ? 'EFSANE!' : 'SONA GELDİN';
      el.over.classList.remove('hidden');
      if(isBest){ cashSound(); setTimeout(()=>burstScreen(),120); }
    }, 480);
  }

  function burstScreen(){ // rekor kutlaması: ekrandan altın yağmuru
    for(let i=0;i<60;i++){
      parts.push({x:rand(0,W),y:-20,vx:rand(-40,40),vy:rand(80,260),life:1,decay:rand(0.35,0.7),
        size:rand(3,7),color:[255,210,74],grav:400,shape:'coin',spin:rand(0,TAU),vspin:rand(-10,10)});
    }
  }

  // ---- Çizim ----
  function drawScene(){
    // arkaplan gradyanı + hafif nabız
    const bgPulse = state===STATE.PLAY ? g.pulse*0.06 : 0;
    const grad = ctx.createRadialGradient(CX,CY,R*0.2, CX,CY, Math.max(W,H)*0.75);
    grad.addColorStop(0, `rgba(28,18,48,${1})`);
    grad.addColorStop(1, '#07060e');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

    if(!g){ return; }

    // dış çember (track)
    ctx.save();
    const pr = 1 + g.pulse*0.05;
    // gölge halka
    ctx.lineWidth = 14;
    ctx.strokeStyle = 'rgba(120,95,190,0.18)';
    ctx.beginPath(); ctx.arc(CX,CY,R,0,TAU); ctx.stroke();

    // altın kapı (arc) — parlayan
    const c=g.ringColor;
    const gp = g.gatePop;
    const gh = g.gateHalf * (1 + gp*0.4); // doğuşta hafif büyük
    ctx.lineCap='round';
    ctx.shadowColor=`rgba(${c[0]},${c[1]},${c[2]},0.9)`;
    ctx.shadowBlur = 26 + g.pulse*30;
    ctx.lineWidth = 16;
    ctx.strokeStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath();
    ctx.arc(CX,CY,R, g.gateCenter-gh, g.gateCenter+gh);
    ctx.stroke();
    // perfect çekirdek çizgisi
    ctx.shadowBlur=10; ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,0.85)';
    const pz=g.gateHalf*0.34;
    ctx.beginPath(); ctx.arc(CX,CY,R, g.gateCenter-pz, g.gateCenter+pz); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();

    // merkez madalyon
    ctx.save();
    const mr = R*0.42*(1+g.pulse*0.08);
    const mg = ctx.createRadialGradient(CX,CY-mr*0.3,2, CX,CY, mr);
    mg.addColorStop(0,'rgba(255,220,120,0.14)');
    mg.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(CX,CY,mr,0,TAU); ctx.fill();
    // seri çarpanı ortada
    if(g.streak>0){
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`900 ${R*0.5}px -apple-system,Segoe UI,Roboto`;
      ctx.fillStyle='rgba(255,225,120,'+(0.25+0.05*Math.sin(performance.now()/120))+')';
      ctx.fillText('x'+g.mult, CX, CY);
    }
    ctx.restore();

    // kıvılcım (orbiting) — kuyruk + parlak baş
    const [sx,sy]=pos(g.angle);
    // kuyruk
    ctx.save();
    for(let i=1;i<=10;i++){
      const ta = g.angle - g.dir*i*0.05;
      const [tx,ty]=pos(ta);
      const a=(1-i/10)*0.5;
      ctx.fillStyle=`rgba(255,225,140,${a})`;
      ctx.beginPath(); ctx.arc(tx,ty, 10*(1-i/12), 0, TAU); ctx.fill();
    }
    ctx.restore();
    // baş
    ctx.save();
    ctx.shadowColor='rgba(255,235,150,1)'; ctx.shadowBlur=28;
    const sparkGrad=ctx.createRadialGradient(sx,sy,1,sx,sy,16);
    sparkGrad.addColorStop(0,'#ffffff'); sparkGrad.addColorStop(0.5,'#ffe27a'); sparkGrad.addColorStop(1,'rgba(255,180,60,0)');
    ctx.fillStyle=sparkGrad; ctx.beginPath(); ctx.arc(sx,sy,16,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx,sy,5,0,TAU); ctx.fill();
    ctx.restore();
  }

  // ---- Ana döngü ----
  let last = performance.now();
  function frame(now){
    let dt = (now-last)/1000; last=now;
    if(dt>0.05) dt=0.05; // sekme geçişlerinde büyük sıçramayı engelle

    // efekt sönümleri (state'ten bağımsız)
    updateParts(dt); updateFloats(dt);
    if(overCooldown>0) overCooldown-=dt;

    if(g){
      g.flash *= Math.pow(0.001, dt);
      g.shake *= Math.pow(0.0001, dt);
      g.pulse *= Math.pow(0.02, dt);
      g.gatePop *= Math.pow(0.02, dt);
    }

    // oyun ilerleyişi (hit-stop sırasında durur)
    if(state===STATE.PLAY && g && !g.over){
      if(g.hitstop>0){ g.hitstop -= dt; }
      else{ g.angle += g.dir * g.speed * dt; g.angle = (g.angle%TAU+TAU)%TAU; }
    }

    // ---- Render ----
    ctx.save();
    let sh = g? g.shake:0;
    if(sh>0.3){ ctx.translate(rand(-sh,sh), rand(-sh,sh)); }
    drawScene();
    drawParts();
    drawFloats();
    ctx.restore();

    // flash katmanı
    if(g && g.flash>0.02){
      ctx.fillStyle=`rgba(255,240,200,${clamp(g.flash,0,0.9)})`;
      ctx.fillRect(0,0,W,H);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // menüde de zemin görünsün diye küçük bir g yer tutucu
  newGame(); g=null;

})();
</script>
