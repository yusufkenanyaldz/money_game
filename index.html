<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06040d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MİDAS — Dokun, Altına Çevir</title>
<style>
  :root{
    --gold:#ffd24a;
    --gold-deep:#f5a623;
    --bg0:#06040d;
    --bg1:#140a24;
    --danger:#ff3b6b;
    --cyan:#38f9d7;
    --violet:#a56bff;
    --ink:#0b0716;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;
    touch-action:manipulation;overscroll-behavior:none;}
  #game{position:fixed;inset:0;display:block;}
  canvas{display:block;width:100%;height:100%;}

  /* soft vignette to focus the eye on the ring */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(120% 100% at 50% 46%, transparent 42%, rgba(4,2,10,.55) 100%);}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  .top{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px;}
  .stat{display:flex;flex-direction:column;gap:3px;}
  .stat .label{font-size:10px;letter-spacing:2.5px;color:#7d72a8;text-transform:uppercase;font-weight:800;}
  .stat.right{align-items:flex-end;}
  #money{font-size:36px;font-weight:900;color:var(--gold);
    text-shadow:0 0 24px rgba(255,210,74,.6);font-variant-numeric:tabular-nums;line-height:1;
    display:flex;align-items:baseline;gap:6px;}
  #money::before{content:"";width:20px;height:20px;border-radius:50%;align-self:center;
    background:radial-gradient(circle at 35% 30%,#fff6cf,#f5a623 70%);box-shadow:0 0 14px rgba(255,190,60,.8);}
  #best{font-size:20px;font-weight:800;color:#cbb9ff;font-variant-numeric:tabular-nums;line-height:1;}

  /* tier chip in the middle top */
  #tier{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:50%;transform:translateX(-50%);
    font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;color:#fff;opacity:0;transition:opacity .4s;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);}

  /* center multiplier burst */
  #combo{position:absolute;top:15%;left:0;right:0;text-align:center;
    font-size:16vw;font-weight:900;color:#fff;opacity:0;
    text-shadow:0 0 44px rgba(255,210,74,.75);line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-2px;}
  #streak{position:absolute;top:calc(15% + 16vw);left:0;right:0;text-align:center;
    font-size:13px;font-weight:800;letter-spacing:5px;color:var(--gold);opacity:0;text-transform:uppercase;}

  /* sound toggle */
  #sound{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);right:18px;
    width:46px;height:46px;border-radius:50%;pointer-events:auto;cursor:pointer;z-index:8;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#cbb9ff;backdrop-filter:blur(6px);transition:transform .1s;}
  #sound:active{transform:scale(.9);}

  /* ---- Overlays ---- */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;pointer-events:auto;z-index:10;
    background:radial-gradient(120% 90% at 50% 38%, rgba(24,14,44,.30), rgba(6,4,12,.90));}
  .hidden{display:none !important;}
  .logo{font-size:20vw;font-weight:900;letter-spacing:-5px;line-height:.8;
    background:linear-gradient(180deg,#fff 0%,#ffe27a 45%,var(--gold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 34px rgba(255,180,60,.5));margin-bottom:8px;
    animation:logoFloat 3s ease-in-out infinite;}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .tag{font-size:14px;letter-spacing:6px;color:#b9a8ef;text-transform:uppercase;font-weight:800;margin-bottom:40px;}
  .cta{font-size:16px;color:#d9ceff;font-weight:600;line-height:1.75;max-width:330px;}
  .cta b{color:var(--gold);font-weight:800;}
  .cta .p{color:var(--cyan);font-weight:800;}
  .pulse-btn{margin-top:36px;pointer-events:auto;
    padding:19px 58px;border:none;border-radius:100px;cursor:pointer;
    font-size:21px;font-weight:900;letter-spacing:1px;color:#3a2600;
    background:linear-gradient(180deg,#ffe888,var(--gold-deep));
    box-shadow:0 10px 0 #a9660d, 0 20px 44px rgba(245,166,35,.55);
    animation:bob 1.6s ease-in-out infinite;transition:transform .06s, box-shadow .06s;}
  .pulse-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #a9660d,0 8px 20px rgba(245,166,35,.4);}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  /* game over */
  #go-title{font-size:12vw;font-weight:900;letter-spacing:-2px;color:#fff;line-height:.9;}
  #go-sub{font-size:14px;letter-spacing:5px;color:var(--danger);text-transform:uppercase;font-weight:800;margin-top:8px;}
  .score-box{margin:32px 0 6px;position:relative;}
  #go-money{font-size:23vw;font-weight:900;color:var(--gold);line-height:.9;
    text-shadow:0 0 54px rgba(255,210,74,.55);font-variant-numeric:tabular-nums;}
  .go-labels{display:flex;gap:14px;justify-content:center;margin-top:18px;}
  .go-labels .gl{display:flex;flex-direction:column;gap:4px;min-width:78px;padding:12px 8px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:16px;}
  .go-labels .glv{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;}
  .go-labels .gll{font-size:10px;letter-spacing:2px;color:#8a7fb0;text-transform:uppercase;font-weight:800;}
  #newbest{margin-top:18px;font-size:15px;font-weight:900;letter-spacing:3px;color:#3a2600;
    background:linear-gradient(180deg,#ffe888,var(--gold));padding:9px 22px;border-radius:100px;text-transform:uppercase;
    display:inline-block;box-shadow:0 0 30px rgba(255,210,74,.6);animation:flash 0.7s steps(2) infinite;}
  @keyframes flash{50%{opacity:.4}}
  .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:0;right:0;text-align:center;
    font-size:12px;letter-spacing:2px;color:#5f5680;font-weight:700;}
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div class="top">
      <div class="stat">
        <span class="label">Altın</span>
        <span id="money">0</span>
      </div>
      <div class="stat right">
        <span class="label">Rekor</span>
        <span id="best">0</span>
      </div>
    </div>
    <div id="tier">SEVİYE 1</div>
    <div id="combo">x2</div>
    <div id="streak">SERİ</div>
    <div id="sound">🔊</div>
  </div>

  <!-- Start -->
  <div class="overlay" id="startScreen">
    <div class="logo">MİDAS</div>
    <div class="tag">Dokun · Altına Çevir</div>
    <div class="cta">Kıvılcım <b>altın kapıdan</b> geçerken dokun.<br>Tam ortası <span class="p">PERFECT</span>. Işkalarsan biter.</div>
    <button class="pulse-btn" id="startBtn">BAŞLA</button>
    <div class="hint">Dokun · Tıkla · Boşluk tuşu</div>
  </div>

  <!-- Game Over -->
  <div class="overlay hidden" id="overScreen">
    <div id="go-title">SONA GELDİN</div>
    <div id="go-sub">Işkaladın</div>
    <div class="score-box">
      <div id="go-money">0</div>
    </div>
    <div class="go-labels">
      <div class="gl"><span class="glv" id="go-hits" style="color:var(--cyan)">0</span><span class="gll">Vuruş</span></div>
      <div class="gl"><span class="glv" id="go-tier" style="color:var(--violet)">1</span><span class="gll">Seviye</span></div>
      <div class="gl"><span class="glv" id="go-best" style="color:#cbb9ff">0</span><span class="gll">Rekor</span></div>
    </div>
    <div id="newbest" style="display:none">YENİ REKOR!</div>
    <button class="pulse-btn" id="retryBtn">TEKRAR</button>
    <div class="hint">Dokun · Tıkla · Boşluk tuşu</div>
  </div>

<script>
"use strict";
(function(){
/* =========================================================================
   MİDAS  —  tek dokunuşluk refleks oyunu (v2: gelişmiş arayüz)
   Palet: koyu zemin + altın ödül + neon ısı rampası (tier'a göre renk).
   Odak: "game feel" / juice — hit-stop, sarsıntı, parçacık, ses, titreşim.
   Tek dosya, bağımlılıksız. Canvas + WebAudio.
   ========================================================================= */

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0, H=0, DPR=1, CX=0, CY=0, R=0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H/2;
    R = Math.min(W,H) * 0.30;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Yardımcılar ----
  const TAU = Math.PI*2;
  const rand = (a,b)=> a + Math.random()*(b-a);
  const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
  function angDiff(a,b){ let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d; }
  const lerp=(a,b,t)=>a+(b-a)*t;
  function lerpCol(a,b,t){ return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))]; }
  const rgb=(c,a)=> a==null?`rgb(${c[0]},${c[1]},${c[2]})`:`rgba(${c[0]},${c[1]},${c[2]},${a})`;

  // ---- Neon ısı rampası (tier renkleri) ----
  const TIERS = [
    {name:'ALTIN',   col:[255,210,74]},
    {name:'AMBER',   col:[255,150,50]},
    {name:'MERCAN',  col:[255,95,120]},
    {name:'MAGENTA', col:[224,80,215]},
    {name:'VİYOLE',  col:[150,110,255]},
    {name:'CAMGÖBEĞİ',col:[56,230,215]},
    {name:'ZÜMRÜT',  col:[70,230,140]},
  ];
  function tierIndex(hits){ return Math.floor(hits/5); }
  function tierData(hits){ const t=tierIndex(hits); return TIERS[t % TIERS.length]; }

  // ---- WebAudio ----
  let AC=null;
  let soundOn = true;
  try{ soundOn = localStorage.getItem('midas_sound')!=='0'; }catch(e){}
  function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(freq, dur, type, vol, glideTo){
    if(!soundOn) return;
    const ac = audio(); if(!ac) return;
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, ac.currentTime+dur);
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.25, ac.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur+0.02);
  }
  const SCALE=[0,3,5,7,10,12,15,17,19,22,24];
  function hitSound(streak){
    const step = SCALE[Math.min(streak, SCALE.length-1)];
    const f = 330 * Math.pow(2, step/12);
    beep(f, 0.18, 'triangle', 0.3); beep(f*2, 0.12, 'sine', 0.12);
  }
  function perfectSound(streak){
    const step = SCALE[Math.min(streak, SCALE.length-1)];
    const f = 440 * Math.pow(2, step/12);
    beep(f, 0.22, 'square', 0.14); beep(f*1.5, 0.28, 'triangle', 0.22); beep(f*2, 0.3, 'sine', 0.16, f*2.02);
  }
  function failSound(){ beep(180, 0.5, 'sawtooth', 0.28, 40); beep(90, 0.6, 'triangle', 0.2, 30); }
  function cashSound(){ beep(523,0.1,'triangle',0.2); setTimeout(()=>beep(659,0.1,'triangle',0.2),70); setTimeout(()=>beep(880,0.16,'triangle',0.24),140); }
  function tierSound(){ beep(660,0.12,'triangle',0.18); setTimeout(()=>beep(990,0.18,'sine',0.2),90); }
  function vibe(ms){ if(navigator.vibrate){ try{navigator.vibrate(ms);}catch(e){} } }

  // ---- Oyun durumu ----
  const STATE = { MENU:0, PLAY:1, OVER:2 };
  let state = STATE.MENU;

  let g = null;
  function newGame(){
    g = {
      angle: 0, dir: 1, speed: 1.7,
      gateCenter: -Math.PI/2, gateHalf: 0.62,
      money: 0, hits: 0, streak: 0, mult: 1, tier: 0,
      shake: 0, flash: 0, hitstop: 0, pulse: 0, gatePop: 0,
      col: [255,210,74],        // anlık kapı rengi (yumuşak geçiş için)
      colTarget: [255,210,74],  // hedef tier rengi
      over: false
    };
  }

  // ---- Ambient zerreler (arka planda yüzen altın/neon motesler) ----
  const motes = [];
  function initMotes(){
    motes.length=0;
    const n = Math.round((W*H)/26000);
    for(let i=0;i<n;i++){
      motes.push({ x:rand(0,W), y:rand(0,H), r:rand(0.6,2.4),
        vy:rand(-8,-22), vx:rand(-6,6), a:rand(0.05,0.35), tw:rand(0,TAU), tws:rand(0.5,1.6) });
    }
  }
  function updateMotes(dt){
    for(const m of motes){
      m.y += m.vy*dt; m.x += m.vx*dt; m.tw += m.tws*dt;
      if(m.y < -6){ m.y = H+6; m.x = rand(0,W); }
      if(m.x < -6) m.x = W+6; if(m.x > W+6) m.x = -6;
    }
  }
  function drawMotes(accent){
    for(const m of motes){
      const a = m.a * (0.6+0.4*Math.sin(m.tw));
      ctx.fillStyle = rgb(accent, a);
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill();
    }
  }
  initMotes();

  // ---- Parçacıklar ----
  const parts = [];
  function burst(x,y,n,opt){
    opt=opt||{};
    for(let i=0;i<n;i++){
      const a = rand(0,TAU);
      const sp = rand(opt.smin||60, opt.smax||420);
      parts.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (opt.up||0),
        life:1, decay:rand(0.6,1.5), size:rand(opt.smin2||2, opt.smax2||6),
        color: opt.color || [255,210,74], grav: opt.grav!=null?opt.grav:900,
        shape: opt.shape||'coin', spin:rand(0,TAU), vspin:rand(-12,12) });
    }
  }
  function ring(x,y,color){ parts.push({ring:true,x,y,r:8,vr:rand(500,760),life:1,decay:2.2,color:color||[255,210,74],lw:rand(3,6)}); }
  function updateParts(dt){
    for(let i=parts.length-1;i>=0;i--){
      const p=parts[i]; p.life -= p.decay*dt;
      if(p.life<=0){ parts.splice(i,1); continue; }
      if(p.ring){ p.r += p.vr*dt; p.vr*=0.92; continue; }
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt; p.vx*=0.99; p.spin+=p.vspin*dt;
    }
  }
  function drawParts(){
    for(const p of parts){
      const a = clamp(p.life,0,1);
      if(p.ring){
        ctx.strokeStyle=rgb(p.color,a*0.8); ctx.lineWidth=p.lw*a;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke(); continue;
      }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin); ctx.globalAlpha=a;
      if(p.shape==='coin'){
        const w=p.size, h=p.size*(0.4+0.6*Math.abs(Math.cos(p.spin)));
        ctx.fillStyle=rgb(p.color); ctx.beginPath(); ctx.ellipse(0,0,w,h,0,0,TAU); ctx.fill();
      }else{
        ctx.fillStyle=rgb(p.color); ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      }
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }

  // ---- Kayan yazılar ----
  const floats=[];
  function floatText(txt,x,y,color,size){ floats.push({txt,x,y,color:color||'#ffd24a',size:size||34,life:1,vy:-70}); }
  function updateFloats(dt){
    for(let i=floats.length-1;i>=0;i--){
      const f=floats[i]; f.life-=dt*1.1; f.y+=f.vy*dt; f.vy*=0.94;
      if(f.life<=0) floats.splice(i,1);
    }
  }
  function drawFloats(){
    for(const f of floats){
      const a=clamp(f.life,0,1);
      const pop = f.life>0.8 ? 1+(f.life-0.8)*3 : 1;
      ctx.save(); ctx.translate(f.x,f.y); ctx.scale(pop,pop); ctx.globalAlpha=a;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`900 ${f.size}px -apple-system,Segoe UI,Roboto,sans-serif`;
      ctx.lineWidth=6; ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.strokeText(f.txt,0,0);
      ctx.fillStyle=f.color; ctx.fillText(f.txt,0,0); ctx.restore();
    }
    ctx.globalAlpha=1;
  }

  // ---- HUD ----
  const el = {
    money:document.getElementById('money'), best:document.getElementById('best'),
    combo:document.getElementById('combo'), streak:document.getElementById('streak'),
    tier:document.getElementById('tier'), sound:document.getElementById('sound'),
    start:document.getElementById('startScreen'), over:document.getElementById('overScreen'),
    goMoney:document.getElementById('go-money'), goHits:document.getElementById('go-hits'),
    goBest:document.getElementById('go-best'), goTier:document.getElementById('go-tier'),
    newbest:document.getElementById('newbest'), goTitle:document.getElementById('go-title'),
  };

  let best = 0;
  try{ best = parseInt(localStorage.getItem('midas_best')||'0',10)||0; }catch(e){}
  el.best.textContent = best;
  el.sound.textContent = soundOn ? '🔊' : '🔇';
  el.sound.addEventListener('pointerdown',(e)=>{ e.preventDefault(); e.stopPropagation();
    soundOn=!soundOn; el.sound.textContent = soundOn?'🔊':'🔇';
    try{ localStorage.setItem('midas_sound', soundOn?'1':'0'); }catch(e2){}
    if(soundOn) beep(660,0.1,'triangle',0.2);
  });

  function showCombo(mult, color){
    el.combo.textContent = 'x'+mult;
    el.combo.style.color = color||'#fff';
    el.combo.style.transition='none'; el.combo.style.opacity='1'; el.combo.style.transform='scale(1.45)';
    el.streak.style.transition='none'; el.streak.style.opacity='1'; el.streak.style.color=color||'#ffd24a';
    void el.combo.offsetWidth;
    el.combo.style.transition='opacity .5s, transform .3s';
    el.combo.style.transform='scale(1)'; el.combo.style.opacity='0';
    el.streak.style.transition='opacity .6s'; el.streak.style.opacity='0';
  }
  function showTier(hits){
    const t=tierData(hits); const idx=tierIndex(hits)+1;
    el.tier.textContent = 'SEVİYE '+idx+' · '+t.name;
    el.tier.style.color = rgb(t.col);
    el.tier.style.borderColor = rgb(t.col,0.5);
    el.tier.style.opacity='1';
    clearTimeout(el.tier._t); el.tier._t=setTimeout(()=>{ el.tier.style.opacity='0'; }, 1400);
  }

  // ---- Giriş ----
  function press(){
    const ac=audio(); if(ac && ac.state==='suspended') ac.resume();
    if(state===STATE.MENU){ start(); return; }
    if(state===STATE.OVER){ if(overCooldown<=0) start(); return; }
    if(state===STATE.PLAY) tap();
  }
  canvas.addEventListener('pointerdown', (e)=>{ e.preventDefault(); press(); }, {passive:false});
  document.getElementById('startBtn').addEventListener('pointerdown',(e)=>{e.preventDefault();e.stopPropagation();press();});
  document.getElementById('retryBtn').addEventListener('pointerdown',(e)=>{e.preventDefault();e.stopPropagation();press();});
  window.addEventListener('keydown',(e)=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); press(); }});

  let overCooldown = 0;

  function start(){
    newGame(); state = STATE.PLAY;
    el.start.classList.add('hidden'); el.over.classList.add('hidden');
    el.money.textContent='0';
    cashSound(); vibe(20);
  }

  function tap(){
    if(g.over) return;
    const d = Math.abs(angDiff(g.angle, g.gateCenter));
    if(d <= g.gateHalf){
      const perfectZone = g.gateHalf * 0.34;
      onHit(d <= perfectZone, d);
    }else{ onMiss(); }
  }

  function pos(angle){ return [CX + Math.cos(angle)*R, CY + Math.sin(angle)*R]; }

  function onHit(perfect, d){
    const prevTier = tierIndex(g.hits);
    g.hits++;
    const [px,py] = pos(g.angle);
    const curTier = tierData(g.hits);

    if(perfect){ g.streak++; g.mult = 1 + g.streak; }
    else{ g.streak = 0; g.mult = 1; }
    const gain = (perfect ? 10 : 5) * g.mult;
    g.money += gain;
    el.money.textContent = g.money;

    // JUICE
    g.flash = perfect ? 0.85 : 0.4;
    g.shake = perfect ? 16 : 8;
    g.hitstop = perfect ? 0.09 : 0.05;
    g.pulse = 1;
    g.colTarget = curTier.col.slice();

    const col = perfect ? lerpCol(curTier.col,[255,255,255],0.4) : curTier.col;
    burst(px,py, perfect?34:18, {color:col, smax:perfect?560:380, grav:1100, up:120});
    ring(px,py, col);
    if(perfect) ring(CX,CY, lerpCol(curTier.col,[255,255,255],0.3));

    floatText('+'+gain, px, py-24, rgb(col), perfect?40:30);
    if(perfect){
      floatText(g.streak>=3? 'MÜKEMMEL x'+g.mult : 'PERFECT!', CX, CY - R - 42, rgb(col), 34);
      showCombo(g.mult, rgb(col)); perfectSound(g.streak); vibe([0,18,25,18]);
    }else{ hitSound(g.hits); vibe(14); }

    // yeni tier'a geçiş
    if(tierIndex(g.hits) !== prevTier){
      showTier(g.hits); tierSound();
      g.flash = Math.max(g.flash, 0.6); g.shake = Math.max(g.shake, 14);
      ring(CX,CY, curTier.col);
    }

    // zorluk + yeni kapı
    g.speed = Math.min(g.speed + 0.14, 8.5);
    g.gateHalf = Math.max(g.gateHalf * 0.965, 0.20);
    let ng; do{ ng = rand(0,TAU); }while(Math.abs(angDiff(ng, g.angle)) < 1.1);
    g.gateCenter = ng; g.gatePop = 1;
    if(g.hits % 5 === 0){ g.dir *= -1; floatText('YÖN!', CX, CY+R+50, rgb(curTier.col), 26); }
  }

  function onMiss(){
    g.over = true; state = STATE.OVER;
    g.shake = 26; g.flash = 0.5; g.hitstop = 0.12;
    const [px,py]=pos(g.angle);
    burst(px,py, 26, {color:[255,60,110], smax:520, grav:1200});
    ring(CX,CY,[255,60,110]);
    failSound(); vibe([0,40,30,80]);

    let isBest=false;
    if(g.money > best){ best=g.money; isBest=true; try{localStorage.setItem('midas_best',String(best));}catch(e){} }
    el.best.textContent = best;

    overCooldown = 0.75;
    const finalTier = tierIndex(g.hits)+1;
    setTimeout(()=>{
      el.goMoney.textContent = g.money;
      el.goHits.textContent = g.hits;
      el.goTier.textContent = finalTier;
      el.goBest.textContent = best;
      el.newbest.style.display = isBest ? 'inline-block' : 'none';
      el.goTitle.textContent = isBest ? 'EFSANE!' : 'SONA GELDİN';
      el.over.classList.remove('hidden');
      if(isBest){ cashSound(); setTimeout(()=>burstScreen(),120); }
    }, 480);
  }

  function burstScreen(){
    for(let i=0;i<60;i++){
      parts.push({x:rand(0,W),y:-20,vx:rand(-40,40),vy:rand(80,260),life:1,decay:rand(0.35,0.7),
        size:rand(3,7),color:[255,210,74],grav:400,shape:'coin',spin:rand(0,TAU),vspin:rand(-10,10)});
    }
  }

  // ---- Çizim ----
  function drawBg(accent){
    const grad = ctx.createRadialGradient(CX,CY,R*0.1, CX,CY, Math.max(W,H)*0.78);
    grad.addColorStop(0, rgb(lerpCol([20,13,38], accent, 0.10)) );
    grad.addColorStop(0.55, '#0c0718');
    grad.addColorStop(1, '#050309');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    // hafif accent hare (kapının yönünde parlama)
    const halo = ctx.createRadialGradient(CX,CY,R*0.3, CX,CY, R*1.9);
    halo.addColorStop(0, rgb(accent, 0.10));
    halo.addColorStop(1, rgb(accent, 0));
    ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);
  }

  function drawScene(){
    const accent = g ? g.col : [150,110,255];
    drawBg(accent);
    drawMotes(accent);
    if(!g) return;

    // dış çember (track) — accent tonlu ince iz
    ctx.save();
    ctx.lineWidth = 12;
    ctx.strokeStyle = rgb(lerpCol([120,95,190], accent, 0.4), 0.20);
    ctx.beginPath(); ctx.arc(CX,CY,R,0,TAU); ctx.stroke();

    // altın kapı — gradyanlı, parlayan
    const c=g.col;
    const gh = g.gateHalf * (1 + g.gatePop*0.4);
    const [gsx,gsy]=pos(g.gateCenter-gh), [gex,gey]=pos(g.gateCenter+gh);
    const gg = ctx.createLinearGradient(gsx,gsy,gex,gey);
    gg.addColorStop(0, rgb(lerpCol(c,[255,255,255],0.15)));
    gg.addColorStop(0.5, rgb(lerpCol(c,[255,255,255],0.5)));
    gg.addColorStop(1, rgb(lerpCol(c,[255,255,255],0.15)));
    ctx.lineCap='round';
    ctx.shadowColor=rgb(c,0.95); ctx.shadowBlur = 30 + g.pulse*34;
    ctx.lineWidth = 17; ctx.strokeStyle = gg;
    ctx.beginPath(); ctx.arc(CX,CY,R, g.gateCenter-gh, g.gateCenter+gh); ctx.stroke();
    // perfect çekirdek
    ctx.shadowBlur=12; ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,0.9)';
    const pz=g.gateHalf*0.34;
    ctx.beginPath(); ctx.arc(CX,CY,R, g.gateCenter-pz, g.gateCenter+pz); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();

    // merkez madalyon + seri
    ctx.save();
    const mr = R*0.44*(1+g.pulse*0.08);
    const mg = ctx.createRadialGradient(CX,CY-mr*0.3,2, CX,CY, mr);
    mg.addColorStop(0, rgb(c,0.16)); mg.addColorStop(1, rgb(c,0));
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(CX,CY,mr,0,TAU); ctx.fill();
    if(g.streak>0){
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`900 ${R*0.5}px -apple-system,Segoe UI,Roboto`;
      ctx.fillStyle=rgb(c, 0.28+0.06*Math.sin(performance.now()/120));
      ctx.fillText('x'+g.mult, CX, CY);
    }
    ctx.restore();

    // kıvılcım + kuyruk
    const [sx,sy]=pos(g.angle);
    ctx.save();
    for(let i=1;i<=10;i++){
      const ta = g.angle - g.dir*i*0.05; const [tx,ty]=pos(ta);
      const a=(1-i/10)*0.5;
      ctx.fillStyle=rgb(lerpCol(c,[255,255,255],0.4), a);
      ctx.beginPath(); ctx.arc(tx,ty, 10*(1-i/12), 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.shadowColor='rgba(255,255,255,1)'; ctx.shadowBlur=28;
    const sparkGrad=ctx.createRadialGradient(sx,sy,1,sx,sy,16);
    sparkGrad.addColorStop(0,'#ffffff'); sparkGrad.addColorStop(0.5, rgb(lerpCol(c,[255,255,255],0.5))); sparkGrad.addColorStop(1, rgb(c,0));
    ctx.fillStyle=sparkGrad; ctx.beginPath(); ctx.arc(sx,sy,16,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(sx,sy,5,0,TAU); ctx.fill();
    ctx.restore();
  }

  // ---- Ana döngü ----
  let last = performance.now();
  function frame(now){
    let dt = (now-last)/1000; last=now;
    if(dt>0.05) dt=0.05;

    updateParts(dt); updateFloats(dt); updateMotes(dt);
    if(overCooldown>0) overCooldown-=dt;

    if(g){
      g.flash *= Math.pow(0.001, dt);
      g.shake *= Math.pow(0.0001, dt);
      g.pulse *= Math.pow(0.02, dt);
      g.gatePop *= Math.pow(0.02, dt);
      // kapı rengini hedefe yumuşat
      g.col = lerpCol(g.col, g.colTarget, clamp(dt*8,0,1));
    }

    if(state===STATE.PLAY && g && !g.over){
      if(g.hitstop>0){ g.hitstop -= dt; }
      else{ g.angle += g.dir * g.speed * dt; g.angle = (g.angle%TAU+TAU)%TAU; }
    }

    ctx.save();
    let sh = g? g.shake:0;
    if(sh>0.3){ ctx.translate(rand(-sh,sh), rand(-sh,sh)); }
    drawScene(); drawParts(); drawFloats();
    ctx.restore();

    if(g && g.flash>0.02){
      ctx.fillStyle=`rgba(255,240,200,${clamp(g.flash,0,0.9)})`;
      ctx.fillRect(0,0,W,H);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  newGame(); g=null;
})();
</script>
