<style>
/* Düzen: tek sütun okuma kolonu; üstte yapışkan bölüm çubuğu, her komut kopyalanabilir bir kart. Minyatür lacivert-altın. */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --zemin:#10141f; --kagit:#171d2b; --murekkep:#e6e8ee; --soluk:#9aa3b6; --cizgi:#2a3246;
  --lacivert:#8fb0ec; --altin:#d9ad4f; --tamam:#6cc293; --kod:#121725; color-scheme:dark}}
:root[data-theme="dark"]{
  --zemin:#10141f; --kagit:#171d2b; --murekkep:#e6e8ee; --soluk:#9aa3b6; --cizgi:#2a3246;
  --lacivert:#8fb0ec; --altin:#d9ad4f; --tamam:#6cc293; --kod:#121725; color-scheme:dark}
body{background:var(--zemin);color:var(--murekkep);font:15px/1.55 var(--f-govde)}
.sar{max-width:880px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 30px/1.15 var(--f-baslik);margin:0 0 6px;text-wrap:balance;color:var(--lacivert)}
h2{font:700 23px/1.2 var(--f-baslik);margin:0;text-wrap:balance}
h3{font:700 18px/1.25 var(--f-baslik);margin:0;color:var(--lacivert)}
p{margin:0}
.ust p{color:var(--soluk);max-width:65ch}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--zemin)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--zemin);border-bottom:1px solid var(--cizgi);margin:16px 0 8px;padding-block:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--murekkep);border:1px solid var(--cizgi);background:var(--kagit);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
nav a span{color:var(--soluk);font-variant-numeric:tabular-nums;margin-left:4px}
nav a.bitti span{color:var(--tamam)}
.arac{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 4px;font-size:13px;color:var(--soluk)}
.arac label{display:flex;gap:6px;align-items:center;cursor:pointer}
section{margin-top:34px;display:grid;gap:14px}
.bolumbas{display:grid;gap:6px;border-top:2px solid var(--altin);padding-top:12px}
.bolumbas .say{font-size:13px;color:var(--soluk);font-variant-numeric:tabular-nums}
.not{color:var(--soluk);font-size:14px;max-width:65ch}
.grup{display:grid;gap:10px;background:var(--kagit);border:1px solid var(--cizgi);border-radius:10px;padding:14px}
.grup>.ac{display:grid;gap:4px}
.grup .etiket{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--altin);font-weight:600}
.kart{display:grid;gap:8px;border-top:1px solid var(--cizgi);padding-top:10px}
.kart:first-of-type{border-top:0;padding-top:0}
.kbas{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kbas b{font-weight:600}
.kbas .tr{color:var(--soluk);font-size:13px;flex:1 1 200px;min-width:0}
pre{margin:0;background:var(--kod);border:1px solid var(--cizgi);border-radius:8px;padding:10px 12px;font:12.5px/1.55 var(--f-kod);white-space:pre-wrap;word-break:break-word;color:var(--murekkep)}
button.kop{font:600 13px var(--f-govde);border:1px solid var(--lacivert);color:var(--lacivert);background:transparent;border-radius:6px;padding:5px 12px;cursor:pointer}
button.kop:hover{background:var(--lacivert);color:var(--kagit)}
button.kop.oldu{border-color:var(--tamam);color:var(--tamam);background:transparent}
.yap{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--soluk);cursor:pointer}
.yap input{width:18px;height:18px;accent-color:var(--tamam)}
.kart.tamam pre{opacity:.45}
.kart.tamam .kbas b{text-decoration:line-through;color:var(--soluk)}
body.gizle .kart.tamam{display:none}
:focus-visible{outline:2px solid var(--altin);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    ['baslaDur', 'Bekle → yürü → dur', 'Yürümeye başlama ve durma köprü klipleri bundan kesilir.',

    ['darbe', 'Darbe alma', 'Yediği darbeyle sarsılır, toparlanır.',

/* ---------- Görünümler ---------- */

const MSTYLE = " Ottoman and Persian miniature painting style in the Shahnameh div tradition, flat vivid colors, fine gold detailing, delicate ink outlines. Full body, three-quarter view facing left, centered, the whole body inside the frame. Flat solid magenta background (#E8087F), no pink or magenta on the creature, no text, no letters, no calligraphy, no halo, no blood, not gory.";
const MSABIT = " The creature stays centered and the same size; the camera does not move, no zoom, no cuts. Every detail of its body and colors stays exactly the same in every frame. Flat solid magenta background #E8087F unchanged, no scenery, no text, no blood.";
const MTAKIP = " The camera tracks it so it stays centered and the same size, no zoom, no cuts. Every detail of its body and colors stays exactly the same in every frame. Flat solid magenta background #E8087F unchanged, no scenery, no text.";
function canavarHareket(kod, vur, olum) {
  return [
    {id:kod+'-gorsel', ad:'Görsel', tr:'Önce bu; beğenince videolar bu görselden.', metin:null},
    {id:kod+'-bekle', ad:'Bekleme', tr:'Döngü olacak.', metin:`Animate this exact creature: an idle menacing loop in place, slow breathing, small shifts of weight, eyes alive. Seamless loop that ends in the starting pose.` + MSABIT},
    {id:kod+'-yuru', ad:'Yürüme (sola)', tr:'Yerinde ilerleyiş, kamera takip eder.', metin:`Animate this exact creature advancing to the left in a three-quarter view with its own natural gait, a continuous moving cycle for the whole clip; it moves in place.` + MTAKIP},
    {id:kod+'-vurus', ad:'Saldırı', tr:'Tek saldırı, sonra eski duruşa döner.', metin:`Animate this exact creature: it performs ONE fast attack toward the left: ${vur}. Then it returns to its starting pose and holds still. It keeps facing left the whole time.` + MSABIT},
    {id:kod+'-darbe', ad:'Darbe alma', tr:'Sarsılır, toparlanır.', metin:`Animate this exact creature: it is struck by an unseen blow from the left: it recoils sharply, staggers back a little, then recovers into its starting pose and holds still. About one second of action.` + MSABIT},
    {id:kod+'-yenilme', ad:'Yenilme', tr:'Yenilip dağılır.', metin:`Animate this exact creature being defeated: ${olum}. Nothing graphic, no blood. The last second shows only the flat magenta background.` + " The camera does not move, no zoom, no cuts. Flat solid magenta background #E8087F unchanged, no scenery, no text."},

}

/* ---------- Bölgeler ---------- */
const BSTYLE = "Ottoman and Persian miniature painting landscape style, flat vivid colors, gold details in the sky, stylized curling clouds, delicate ink outlines, no people, no animals, no text, no letters, no calligraphy.";
const BOLGE = [
  {kod:'gaflet', ad:'Gaflet Ovası (başlangıç)', uzak:"a wide calm plain under a golden dawn sky, soft blue distant hills, a few slender cypress trees far away", orta:"gentle rolling green and ochre hills with scattered cypress trees and flowering shrubs"},

    {etiket:'Garip', baslik:'Bekle ↔ yürü', not:'Önceki klipte heybe kızıl kahveye dönmüştü; heybe zeytin yeşili kalmalı.', kartlar:[{id:'garip-baslaDur', ad:'Bekle → yürü → dur', tr:'Heybe ve yamalar her karede aynı kalmalı.',
      metin:"Single continuous 6-second shot of the exact same character from the reference image: an Ottoman Persian miniature style young male traveler in a patched beige robe, cream embroidered cap, sandals with wrapped legs, carrying an OLIVE-GREEN burlap sack on his back. He starts standing still in a relaxed idle pose, then walks naturally to the left for about three calm steps in a three-quarter view (body turned slightly toward the viewer, facing left), then slows down, plants his feet and settles back into the same relaxed idle pose, holding it still for the final second. The camera tracks him so he stays centered in the frame the whole time; full body always visible, same size, no zoom. The character's design must stay identical in every frame: the sack stays the same olive-green color and the same size, the robe patches stay exactly the same shapes, colors and positions (light gray-blue and beige patches), no new patches, no color shifts. Solid flat magenta background #E8087F, no shadows on the background, no text, no halo, no other objects, no pink on the character."}]},

/* ---------- Çizim ---------- */
const anahtar = id => 'grok:' + id;
const oku = id => { try { return localStorage.getItem(anahtar(id)) === '1'; } catch (e) { return false; } };
const yaz = (id, v) => { try { v ? localStorage.setItem(anahtar(id), '1') : localStorage.removeItem(anahtar(id)); } catch (e) {} };
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const icerik = document.getElementById('icerik'), nav = document.getElementById('nav');
let html = '';
for (const b of BOLUMLER) {
  html += `<section id="${b.id}"><div class="bolumbas"><h2>${b.ad}</h2><p class="not">${b.not}</p><p class="say" data-say="${b.id}"></p></div>`;
  for (const g of b.gruplar) {
    html += `<div class="grup"><div class="ac"><span class="etiket">${g.etiket}</span><h3>${g.baslik}</h3>${g.not ? `<p class="not">${g.not}</p>` : ''}</div>`;
    for (const k of g.kartlar) {
      html += `<div class="kart" data-id="${k.id}" data-bolum="${b.id}"><div class="kbas"><b>${k.ad}</b><span class="tr">${k.tr || ''}</span>
        <button class="kop" type="button">Kopyala</button>
        <label class="yap"><input type="checkbox" id="y-${k.id}"> Yapıldı</label></div><pre>${esc(k.metin)}</pre></div>`;
    }
    html += `</div>`;
  }
  html += `</section>`;
}
icerik.innerHTML = html;
function sayaclar() {
  let tY = 0, tH = 0; nav.innerHTML = '';
  for (const b of BOLUMLER) {
    const ks = [...document.querySelectorAll(`.kart[data-bolum="${b.id}"]`)], y = ks.filter(k => k.classList.contains('tamam')).length;
    tY += y; tH += ks.length;
    document.querySelector(`[data-say="${b.id}"]`).textContent = `${y} / ${ks.length} yapıldı`;
    const a = document.createElement('a'); a.href = '#' + b.id; a.innerHTML = `${b.ad.split(' · ')[1]}<span>${y}/${ks.length}</span>`;
    if (y === ks.length) a.classList.add('bitti'); nav.appendChild(a);
  }
  document.getElementById('toplam').textContent = `Toplam ${tY} / ${tH} komut yapıldı`;
}
document.querySelectorAll('.kart').forEach(k => {
  const id = k.dataset.id, cb = k.querySelector('input'), pre = k.querySelector('pre'), btn = k.querySelector('.kop');
  cb.checked = oku(id); k.classList.toggle('tamam', cb.checked);
  cb.addEventListener('change', () => { yaz(id, cb.checked); k.classList.toggle('tamam', cb.checked); sayaclar(); });
  btn.addEventListener('click', () => {
    const bitti = () => { btn.textContent = 'Kopyalandı'; btn.classList.add('oldu'); setTimeout(() => { btn.textContent = 'Kopyala'; btn.classList.remove('oldu'); }, 1600); };
    const sec = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Seçildi, uzun basıp kopyala'; };
    try { navigator.clipboard.writeText(pre.textContent).then(bitti, sec); } catch (e) { sec(); }
  });
});
const gk = document.getElementById('gizleKutu');
try { gk.checked = localStorage.getItem('grok:gizle') === '1'; } catch (e) {}
document.body.classList.toggle('gizle', gk.checked);
gk.addEventListener('change', () => { document.body.classList.toggle('gizle', gk.checked); try { localStorage.setItem('grok:gizle', gk.checked ? '1' : '0'); } catch (e) {} });
sayaclar();
</script>
