<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e2d3">
<title>Gizli El</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  /* arşivden çıkmış dosya: sıcak kemik kâğıt, sepya mürekkep */
  --kagit:#e9e2d3; --kagit2:#e2dac8; --kagit3:#ddd4c0;
  --murekkep:#2c2620; --soluk:#6d6355; --cok-soluk:#9c9082;
  --cizgi:#c6bba4; --cizgi-ince:#d6cdb9;
  --damga:#8c3a2b;
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--kagit)}
body{margin:0;background:var(--kagit);color:var(--murekkep);
  font-family:var(--serif);font-size:17.5px;line-height:1.66;
  font-variant-numeric:oldstyle-nums;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none}
.sar{max-width:620px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-weight:400;margin:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;text-align:left;cursor:pointer}
.soluk{color:var(--soluk)}

/* kenar notu + gövde: basılı rapor düzeni */
.blok{display:grid;grid-template-columns:62px 1fr;gap:0 16px;margin:0 0 20px}
.kenar{font-style:italic;font-size:13.5px;line-height:1.3;color:var(--cok-soluk);padding-top:6px}
.govde{min-width:0}
.not{font-style:italic;font-size:14px;color:var(--cok-soluk)}

/* karalama: bilinmeyen basılmamıştır */
.kara{display:inline-block;background:var(--murekkep);height:.74em;vertical-align:-.06em;
      opacity:.82;border-radius:.5px}

hr{border:none;border-top:1px solid var(--cizgi);margin:24px 0}
hr.ince{border-top:1px solid var(--cizgi-ince);margin:14px 0}

/* ---- başlık şeridi ---- */
#durum{position:sticky;top:0;z-index:20;background:var(--kagit);padding:14px 0 8px;
       box-shadow:0 10px 12px -10px rgba(44,38,32,.18)}
#durumSatir{font-size:15px;color:var(--soluk);display:flex;flex-wrap:wrap;gap:2px 16px;
            font-variant-numeric:oldstyle-nums}
#durumSatir b{font-weight:400;color:var(--murekkep)}
#durumSatir .uyari b{color:var(--damga)}

/* ---- çekmeceler: büyük harf yok, sakin bir satır ---- */
#cekmeceler{display:flex;flex-wrap:wrap;gap:0 20px;padding:4px 0 12px;
            border-bottom:1px solid var(--cizgi)}
#cekmeceler button{font-size:16px;color:var(--cok-soluk);padding:2px 0;font-style:italic}
#cekmeceler button[aria-current="true"]{color:var(--murekkep);font-style:normal;
            box-shadow:inset 0 -1px 0 var(--murekkep)}

main{padding:26px 0 130px;min-height:60vh}
section[hidden]{display:none}

/* ---- dosya çağrısı: kart değil, girintili paragraf ---- */
.cagri{display:block;width:100%;padding:2px 0 14px;margin:0 0 4px;border-bottom:1px solid var(--cizgi-ince)}
.cagri .ust{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.cagri h3{font-size:21px}
.cagri .sure{font-size:14px;font-style:italic;color:var(--damga);white-space:nowrap}
.cagri p{margin:3px 0 0;color:var(--soluk);font-size:16.5px}

/* ---- kronik ---- */
.olay{display:grid;grid-template-columns:34px 1fr;gap:0 14px;padding:6px 0}
.olay .t{font-size:13.5px;color:var(--cok-soluk);font-style:italic;padding-top:4px}
.olay.vurgu .m{border-left:2px solid var(--cizgi);padding-left:12px;margin-left:-14px}

/* ---- güçler ---- */
.frak{padding:11px 0;border-bottom:1px solid var(--cizgi-ince)}
.frak .ad{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.frak .ad .isim{font-size:18.5px}
.frak .ad .rozet{font-size:13.5px;font-style:italic;color:var(--cok-soluk);white-space:nowrap}
.frak .izgara{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;margin-top:4px}
.frak .sat{display:flex;gap:7px;align-items:baseline;font-size:15px;line-height:1.5}
.frak .sat .et{font-style:italic;font-size:13px;color:var(--cok-soluk);min-width:62px;flex:none}
.frak .sat .dg{color:var(--murekkep)}
.nokta{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;vertical-align:1px;
       opacity:.85}

/* ---- şema ---- */
#sema{width:100%;height:auto;display:block;margin:4px 0 16px}
#sema text{font-family:var(--serif);font-size:10px;fill:var(--soluk);pointer-events:none}
#sema circle{pointer-events:auto}
.bolgeBilgi{font-size:15.5px;color:var(--soluk);border-top:1px solid var(--cizgi);padding-top:12px;
            min-height:52px}

/* ---- kütüphane ---- */
.kuram{padding:14px 0;border-bottom:1px solid var(--cizgi-ince)}
.kuram h3{font-size:19px}
.kuram .tek{margin:3px 0 4px}
.kuram .kaynak{font-size:14.5px;font-style:italic;color:var(--cok-soluk)}

/* ---- alt şerit ---- */
#alt{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--kagit);
     box-shadow:0 -12px 14px -10px rgba(44,38,32,.2);
     padding:14px 0 calc(14px + env(safe-area-inset-bottom))}
#alt .sar{display:flex;gap:14px}
.dugme{flex:1;border:1px solid var(--murekkep);background:none;padding:11px 14px;text-align:center;
       font-size:16px}
.dugme.vurgu{box-shadow:0 0 0 1px var(--murekkep) inset;border-color:var(--murekkep)}
.dugme:disabled{opacity:.3}
.dugme.sakin{border-color:var(--cizgi);color:var(--soluk)}

/* ---- örtü ---- */
#ortu{position:fixed;inset:0;z-index:40;background:var(--kagit);overflow-y:auto;
      -webkit-overflow-scrolling:touch}
#ortu[hidden]{display:none}
#ortu .sar{padding-top:22px;padding-bottom:70px}
.kapat{font-size:15px;font-style:italic;color:var(--cok-soluk);margin-bottom:18px;display:block}

/* ---- dosya sayfası ---- */
.dosyaBaslik{font-size:29px;line-height:1.25;margin-bottom:1px}
.taniklik{display:grid;grid-template-columns:96px 1fr;gap:0 16px;padding:11px 0;
          border-bottom:1px solid var(--cizgi-ince)}
.taniklik .kaynak{font-style:italic;font-size:13.5px;color:var(--cok-soluk);line-height:1.3;padding-top:4px}
.taniklik .iddia{font-size:17px}
.olcum{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:16px}
.olcum .ad{color:var(--soluk)}
.olcum .nokta-sirasi{flex:1;border-bottom:1px dotted var(--cizgi);transform:translateY(-4px)}
.olcum .dg{color:var(--murekkep);font-variant-numeric:oldstyle-nums tabular-nums;white-space:nowrap}
.celiski{border-left:2px solid var(--damga);padding:2px 0 2px 14px;margin:14px 0}
.celiski .yan{display:grid;grid-template-columns:96px 1fr;gap:0 16px;margin:8px 0}
.celiski .yan .kaynak{font-style:italic;font-size:13.5px;color:var(--cok-soluk);line-height:1.3;padding-top:3px}
.secenek{display:grid;grid-template-columns:22px 1fr;gap:0 10px;width:100%;padding:12px 0;
         border-bottom:1px solid var(--cizgi-ince)}
.secenek .no{font-style:italic;color:var(--cok-soluk);font-size:15px;padding-top:2px}
.secenek b{font-weight:400;font-size:18px;display:block}
.secenek span{color:var(--soluk);font-size:16px}

/* ---- emir ---- */
.sec-liste button{display:grid;grid-template-columns:1fr auto;gap:0 14px;width:100%;
                  padding:11px 0;border-bottom:1px solid var(--cizgi-ince);align-items:baseline}
.sec-liste button .yan{font-size:13.5px;font-style:italic;color:var(--cok-soluk);text-align:right}
.bedel{font-size:16px;color:var(--soluk);margin:16px 0 22px;border-top:1px solid var(--cizgi);
       padding-top:14px}
.bedel b{color:var(--murekkep);font-weight:400}

/* ---- giriş ---- */
#giris{position:fixed;inset:0;z-index:60;background:var(--kagit);overflow-y:auto;display:flex;
       align-items:center}
#giris[hidden]{display:none}
#giris .sar{width:100%;padding-top:44px;padding-bottom:44px}
#giris h1{font-size:40px;letter-spacing:.06em;margin-bottom:2px}
#giris .alt{color:var(--cok-soluk);font-style:italic;font-size:16.5px;margin-bottom:30px}
.dok{display:block;width:100%;padding:12px 0;border-bottom:1px solid var(--cizgi-ince)}
.dok b{display:block;font-weight:400;font-size:19px}
.dok span{color:var(--soluk);font-size:16px}
#arama{color:var(--cok-soluk);font-style:italic;font-size:15px;margin-top:18px;min-height:22px}
textarea{width:100%;height:120px;background:var(--kagit2);color:var(--soluk);
         border:1px solid var(--cizgi);font-family:ui-monospace,Menlo,monospace;font-size:11px;
         padding:10px;margin-top:10px}
summary{font-style:italic;color:var(--cok-soluk);cursor:pointer}
</style>
</head>
<body>

<div id="giris">
  <div class="sar">
    <h1>GİZLİ EL</h1>
    <div class="alt">Hiçbir tahtta oturmuyorsun.</div>
    <div class="not" style="margin-bottom:10px">Doktrinini seç — neyin iyi olduğunu o tanımlar</div>
    <div id="doktrinler"></div>
    <div id="arama"></div>
    <div class="ayrac"></div>
    <button class="dugme" id="yukleBtn" style="display:none">Kayıtlı oyuna dön</button>
    <details style="margin-top:14px">
      <summary>Kayıt metnini içeri al</summary>
      <textarea id="iceriAl" placeholder="Dışa aktardığın metni buraya yapıştır"></textarea>
      <button class="dugme" id="iceriAlBtn" style="margin-top:8px">Yükle</button>
    </details>
  </div>
</div>

<header id="durum"><div class="sar"><div class="satir" id="durumSatir"></div></div></header>
<nav><div class="sar" id="cekmeceler"></div></nav>

<main class="sar">
  <section id="masa"></section>
  <section id="harita" hidden></section>
  <section id="kronik" hidden></section>
  <section id="kutuphane" hidden></section>
</main>

<div id="alt"><div class="sar">
  <button class="dugme" id="emirBtn">Emir yaz</button>
  <button class="dugme vurgu" id="gecBtn">Mevsimi geçir</button>
</div></div>

<div id="ortu" hidden><div class="sar" id="ortuIc"></div></div>

<script src="tohumlar.js"></script>
<script src="sim.js"></script>
<script src="ui.js"></script>
</body>
</html>
