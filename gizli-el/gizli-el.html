const ACIK_TAVAN = 2;
function meseleAc(w, tip, ilgili){
  // Tavan burada uygulanır: tohum meselesi de dünyanın krizi de aynı
  // kuyruğa girer, yoksa oyuncu aynı anda dört dosyayla karşılaşır.
  if (w.meseleler.filter(m=>m.acik).length >= ACIK_TAVAN) return null;
  const T = MESELE_TANIM[tip];
  const m = {
    id: w.meseleler.length, tip, baslik: T.baslik, kavram: T.kavram,
    acilis: w.tur, pencere: T.pencere, secenekler: T.secenekler.slice(),
    ilgili, acik: true, karar: null, kapanis: null, gunluk: []
  };
  w.meseleler.push(m);
  return m;
}

// Dünyayı dallandırmak için (senaryo karşılaştırması, ileride geri alma yok)
function klonla(w){
  const rng = w.kurulumRng; delete w.kurulumRng;
  const k = JSON.parse(JSON.stringify(w));
  w.kurulumRng = rng;
  return k;
}

/* Meselelerin açılışı: tohum dışındaki krizler de dünyanın kendi
 * hareketinden doğar. Hepsi pencereli ve hepsi açıkken gelişir. */
function meseleTaramasi(w){
  const out = [], F = w.fac;
  if (!w.el || w.el.bitti) return out;
  // güç geçmişi her turda tazelenir; yoksa mesele kapalıyken ivme şişer
  const oncekiGuc = w.gucGecmis;
  w.gucGecmis = F.map(f=>f.v.guc);
  // Oyuncu boğulmasın: aynı anda en çok iki mesele açık kalır.
  // Kapalı kalan kriz yok olmaz, dünyanın kendi akışında sürer.
  if (w.meseleler.filter(m=>m.acik).length >= 2) return out;
  const acikMi = (tip, kim)=> w.meseleler.some(m=>m.acik && m.tip===tip &&
    (kim.bolge != null ? m.ilgili.bolge===kim.bolge
     : (kim.hedefFac != null ? (m.ilgili.fac===kim.fac && m.ilgili.hedefFac===kim.hedefFac)
        : m.ilgili.fac===kim.fac)));

  // THUKYDIDES: savaşı çıkaran güç farkı değil, farkın değişme hızıdır
  for (let i=0;i<F.length;i++){
    if (!F[i].canli) continue;
    const ivme = F[i].v.guc - ((oncekiGuc && oncekiGuc[i] !== undefined) ? oncekiGuc[i] : F[i].v.guc);
    for (let j=0;j<F.length;j++){
      if (i===j || !F[j].canli) continue;
      if (w.R[i][j] > -60) continue;
      if (acikMi('savasEsigi', { fac:i, hedefFac:j })) continue;
      // yükselen güç + derin düşmanlık
      const p = kirp((ivme*0.10) + ((-w.R[i][j]-60)/220) + (F[i].v.guc-F[j].v.guc)/600, 0, 0.022);
      if (hsh(w.seed+'|mt1|'+w.tur+'|'+i+'|'+j) < p &&
          meseleAc(w, 'savasEsigi', { fac:i, hedefFac:j, ivme:+ivme.toFixed(2) })){
        out.push({ tur:w.tur, tip:'meseleAcildi', fac:i, hedef:j, kavram:'thucydides',
          metin:`${F[i].ad} ile ${F[j].ad} savaşın eşiğinde.` });
      }
    }
  }
  // KANTOROWICZ: makam kişiden ayrılamazsa ikisi birden ölür
  for (let i=0;i<F.length;i++){
    const f = F[i];
    if (!f.canli || acikMi('verasetKrizi', { fac:i })) continue;
    const yaslı = f.lider.yas > 58, hasta = f.lider.saglik < 52;
    if (!yaslı && !hasta) continue;
    const p = kirp((f.lider.yas-56)/260 + (60-f.lider.saglik)/900 + (55-f.asabiyet)/900, 0, 0.055);
    if (hsh(w.seed+'|mt2|'+w.tur+'|'+i) < p && meseleAc(w, 'verasetKrizi', { fac:i })){
      out.push({ tur:w.tur, tip:'meseleAcildi', fac:i, kavram:'kantorowicz',
        metin:`${f.ad}: ${f.lider.ad} zayıflıyor, makam sallantıda.` });
    }
  }

  // OSTROM: kuralı çökmüş ortak toprak
  for (const b of w.bolgeler){
    if (!b.ortak || acikMi('ortakAnlasmazligi', { bolge:b.id })) continue;
    if (b.gelenek > 28 || b.huzursuzluk < 52) continue;
    const p = kirp((b.huzursuzluk-50)/300 + (30-b.gelenek)/400, 0, 0.045);
    if (hsh(w.seed+'|mt3|'+w.tur+'|'+b.id) < p && meseleAc(w, 'ortakAnlasmazligi', { bolge:b.id, fac:b.sahip })){
      out.push({ tur:w.tur, tip:'meseleAcildi', bolge:b.id, fac:b.sahip, kavram:'ostrom',
        metin:`${b.ad}'nda kural kalmadı; üç güç birden göz dikti.` });
    }
  }
  return out;
}

function meselePencere(w, m){ return m.acilis + m.pencere - w.tur; }

function meseleleriIsle(w){
  const out = [];
  for (const m of w.meseleler){
    if (!m.acik) continue;
    const t = m.ilgili.tohum != null ? w.tohumlar[m.ilgili.tohum] : null;
    // durum açık kaldıkça gelişir
    if (t && t.canli){
      m.gunluk.push({ tur:w.tur, olgunluk:Math.round(t.olgunluk), denetim:Math.round(t.denetim),
                      gercek:Math.round(t.gercekDestek), gorunur:Math.round(t.gorunurDestek) });
    }
    if (meselePencere(w, m) <= 0){
      // karar vermemek de bir karardır
      out.push(...meseleKarar(w, m.id, 'bekle', true));
    }
  }
  return out;
}

function meseleKarar(w, meseleId, karar, sureDoldu){
  const m = w.meseleler[meseleId];
  const out = [];
  if (!m || !m.acik) return out;
  if (m.secenekler.indexOf(karar) < 0) karar = 'bekle';
  const t = m.ilgili.tohum != null ? w.tohumlar[m.ilgili.tohum] : null;
  const f = t ? w.fac[t.fac] : (m.ilgili.fac != null ? w.fac[m.ilgili.fac] : null);
  m.acik = false; m.karar = karar; m.kapanis = w.tur; m.sureDoldu = !!sureDoldu;

  const K = KAVRAMLAR[m.kavram];
  kutuphaneEkle(w, m.kavram);
  const not = (metin, ek) => out.push(Object.assign({ tur:w.tur, tip:'mesele', mesele:m.id,
    kavram:m.kavram, kavramAd:K.ad, kaynak:K.kaynak, metin }, ek||{}));

  // tohum dışı meseleler
  if (m.tip === 'savasEsigi' || m.tip === 'verasetKrizi' || m.tip === 'ortakAnlasmazligi'){
    out.push(...meseleKararDis(w, m, karar, not));
    return out;
  }

  if (!t || !t.canli || !f){ not('Mesele kendiliğinden kapandı.'); return out; }

  switch (karar){
    case 'bekle':
      // hiçbir şey yapmamak hareketi serbest bırakır
      t.denetim = kirp(t.denetim - 6, 0, 100);
      not(sureDoldu
        ? `${t.ad} meselesinde süre doldu. Karar vermemek de bir karardı.`
        : `${t.ad} meselesinde beklemeyi seçtin.`);
      break;

    case 'gozetle':
      // vekil sorunu: gözetim işe yarar ama pahalıdır ve fark edilir
      t.gozetim = true;
      f.v.servet = kirp(f.v.servet - 3, 0.4, 99.6);
      f.v.bilgi  = kirp(f.v.bilgi + 4, 0.4, 99.6);
      t.gercekDestek = kirp(t.gercekDestek + 4, 0, 100);
      not(`${t.ad} üzerine göz koydun. Gözetim pahalı ve görünür.`, { ikincilKavram:'vekil' });
      break;

    case 'kurumsallastir':
      // hareketi düzenin parçası yap: kopuş biter, sapma kalıcılaşır
      t.kurumsal = true;
      t.denetim = kirp(t.denetim + 26, 0, 100);
      t.olgunluk = kirp(t.olgunluk - 8, 0, 100);
      f.v.mesruiyet = kirp(f.v.mesruiyet + 6, 0.4, 99.6);
      f.v.istikrar  = kirp(f.v.istikrar + 4, 0.4, 99.6);
      // ama artık sökülemez: kendi doğrultusunu düzene taşır
      for (let i=0;i<3;i++) f.ideoloji[i] = kirp(f.ideoloji[i]*0.85 + t.dogrultu[i]*0.15, -1, 1);
      not(`${t.ad} düzenin parçası oldu. Artık sökülemez — ve düzeni kendine benzetecek.`);
      break;

    case 'yonlendir': {
      // başka bir hedefe koşmak: denetim yetiyorsa güçlü, yetmiyorsa geri teper
      const sans = kirp(t.denetim/100 * 1.15 - t.olgunluk/260, 0.05, 0.95);
      if (hsh(w.seed+'|yn|'+w.tur+'|'+t.id) < sans){
        const amaclar = Object.keys(AMACLAR).filter(a=>a!==t.amac);
        t.amac = amaclar[Math.floor(hsh(w.seed+'|ya|'+w.tur+'|'+t.id)*amaclar.length)];
        t.denetim = kirp(t.denetim + 10, 0, 100);
        not(`${t.ad} yeni bir hedefe çevrildi: ${AMACLAR[t.amac].ad}. Tuttu.`);
      } else {
        t.denetim = kirp(t.denetim - 20, 0, 100);
        t.gercekDestek = kirp(t.gercekDestek + 9, 0, 100);
        not(`${t.ad} yönlendirilmeye direndi. Artık senin olmadığını biliyorlar.`);
      }
      break;
    }

    case 'bastir': {
      // KURAN: görünür destek çöker, gerçek destek büyür — ve saklanır
      t.bastirilma = 5;
      t.gorunurDestek = kirp(t.gorunurDestek * 0.25, 0, 100);
      t.gercekDestek = kirp(t.gercekDestek + 12 + t.olgunluk/8, 0, 100);
      f.v.guc      = kirp(f.v.guc - 3, 0.4, 99.6);
      f.v.istikrar = kirp(f.v.istikrar + 7, 0.4, 99.6);
      f.v.ofke     = kirp(f.v.ofke + 5, 0.4, 99.6);
      t.denetim = kirp(t.denetim + 12, 0, 100);
      not(`${t.ad} bastırıldı. Sokak sessiz.`);
      break;
    }

    case 'gunahKecisi':
      // GIRARD: suçu birine yıkmak krizi gerçekten çözer — bir süreliğine
      f.v.ofke      = kirp(f.v.ofke - 16, 0.4, 99.6);
      f.v.istikrar  = kirp(f.v.istikrar + 9, 0.4, 99.6);
      f.v.mesruiyet = kirp(f.v.mesruiyet - 5, 0.4, 99.6);
      t.gercekDestek = kirp(t.gercekDestek + 7, 0, 100);
      not(`Suç ${t.ad}'nin üstüne yıkıldı. Öfke dindi.`);
      break;

    case 'terk':
      t.besleniyor = false; t.gozetim = false;
      t.denetim = kirp(t.denetim - 30, 0, 100);
      not(`${t.ad} ile bağını kopardın. Artık seni suçlayamazlar — ve dinlemezler.`);
      break;
  }
  return out;
}

function meseleKararDis(w, m, karar, not){
  const out = [], il = m.ilgili;
  const A = il.fac != null ? w.fac[il.fac] : null;
  const B = il.hedefFac != null ? w.fac[il.hedefFac] : null;
  const bol = il.bolge != null ? w.bolgeler[il.bolge] : null;

  if (m.tip === 'savasEsigi'){
    if (!A || !B || !A.canli || !B.canli){ not('Taraflardan biri kalmadı; mesele kapandı.'); return out; }
    switch (karar){
      case 'arabulucu':
        w.R[A.id][B.id] = kirp(w.R[A.id][B.id] + 26, -100, 100);
        w.R[B.id][A.id] = kirp(w.R[B.id][A.id] + 20, -100, 100);
        A.v.mesruiyet = kirp(A.v.mesruiyet - 3, 0.4, 99.6);
        B.v.mesruiyet = kirp(B.v.mesruiyet - 3, 0.4, 99.6);
        not(`${A.ad} ile ${B.ad} geri çekildi. İkisi de neden olduğunu bilmiyor.`);
        break;
      case 'sizdirPlan':
        B.v.bilgi = kirp(B.v.bilgi + 11, 0.4, 99.6);
        B.v.istikrar = kirp(B.v.istikrar + 5, 0.4, 99.6);
        A.v.guc = kirp(A.v.guc - 4, 0.4, 99.6);
        w.R[A.id][B.id] = kirp(w.R[A.id][B.id] - 10, -100, 100);
        not(`${B.ad} baskına uğramayacak. ${A.ad} bunu henüz bilmiyor.`, { kavram:'scott' });
        break;
      case 'yonSaptir': {
        let ucuncu = -1, enZayif = 999;
        for (let j=0;j<w.fac.length;j++){
          if (j===A.id || j===B.id || !w.fac[j].canli) continue;
          if (skor(w.fac[j]) < enZayif){ enZayif = skor(w.fac[j]); ucuncu = j; }
        }
        if (ucuncu >= 0){
          w.R[A.id][B.id] = kirp(w.R[A.id][B.id] + 22, -100, 100);
          w.R[A.id][ucuncu] = kirp(w.R[A.id][ucuncu] - 42, -100, 100);
          w.R[B.id][ucuncu] = kirp(w.R[B.id][ucuncu] - 18, -100, 100);
          not(`Öfke ${w.fac[ucuncu].ad}'na yöneldi. Bu savaş çıkmayacak.`, { kavram:'girard' });
        } else not('Yönlendirilecek üçüncü taraf kalmamış.');
        break;
      }
      case 'kizistir':
        w.R[A.id][B.id] = kirp(w.R[A.id][B.id] - 30, -100, 100);
        w.R[B.id][A.id] = kirp(w.R[B.id][A.id] - 24, -100, 100);
        A.v.ofke = kirp(A.v.ofke + 7, 0.4, 99.6);
        not(`${A.ad} ile ${B.ad} arasında artık geri dönüş yok.`);
        break;
      default:
        w.R[A.id][B.id] = kirp(w.R[A.id][B.id] - 6, -100, 100);
        not(m.sureDoldu ? 'Savaş eşiğinde beklemeyi seçtin; süre doldu.' : 'Savaş eşiğinde beklemeyi seçtin.');
    }
    return out;
  }

  if (m.tip === 'verasetKrizi'){
    if (!A || !A.canli){ not('Fraksiyon kalmadı; mesele kapandı.'); return out; }
    switch (karar){
      case 'veliahtDestekle':
        A.v.mesruiyet = kirp(A.v.mesruiyet + 13, 0.4, 99.6);
        A.v.istikrar  = kirp(A.v.istikrar + 8, 0.4, 99.6);
        A.asabiyet    = kirp(A.asabiyet - 6, 0, 100);
        A.nesil++;
        not(`${A.ad}'nda makam korundu. Kişi zayıf, düzen ayakta.`);
        break;
      case 'rakipDestekle': {
        const eski = A.lider.ad;
        A.lider = liderUret(mulberry32(Math.floor(hsh(w.seed+'|vk|'+w.tur+'|'+A.id)*1e9)));
        A.nesil = 0;
        A.asabiyet = kirp(A.asabiyet + 26, 0, 100);
        A.v.mesruiyet = kirp(A.v.mesruiyet - 11, 0.4, 99.6);
        A.v.istikrar  = kirp(A.v.istikrar - 9, 0.4, 99.6);
        not(`${eski} gitti, ${A.lider.ad} geldi. Taze ve sana borçlu — ikisi de tehlikeli.`, { kavram:'haldun' });
        break;
      }
      case 'uzlastir':
        A.v.mesruiyet = kirp(A.v.mesruiyet + 7, 0.4, 99.6);
        A.v.istikrar  = kirp(A.v.istikrar + 12, 0.4, 99.6);
        A.v.ofke      = kirp(A.v.ofke + 5, 0.4, 99.6);
        A.asabiyet    = kirp(A.asabiyet - 3, 0, 100);
        not(`${A.ad}'nda kriz kapandı. İki taraf da tatminsiz, ikisi de sessiz.`);
        break;
      case 'krizDerinlestir':
        A.v.mesruiyet = kirp(A.v.mesruiyet - 17, 0.4, 99.6);
        A.v.istikrar  = kirp(A.v.istikrar - 15, 0.4, 99.6);
        A.v.ofke      = kirp(A.v.ofke + 11, 0.4, 99.6);
        A.asabiyet    = kirp(A.asabiyet - 12, 0, 100);
        for (let j=0;j<w.fac.length;j++) if (j!==A.id && w.fac[j].canli)
          w.R[j][A.id] = kirp(w.R[j][A.id] - 9, -100, 100);
        not(`${A.ad}'nda kimse tahta oturamadı. Komşuları bunu fark etti.`);
        break;
      default:
        A.v.istikrar  = kirp(A.v.istikrar - 5, 0.4, 99.6);
        A.v.mesruiyet = kirp(A.v.mesruiyet - 4, 0.4, 99.6);
        not(m.sureDoldu ? 'Veraset kendi hâline bırakıldı; süre doldu.' : 'Verasete karışmamayı seçtin.');
    }
    return out;
  }

  if (m.tip === 'ortakAnlasmazligi'){
    if (!bol){ not('Toprak meselesi kapandı.'); return out; }
    const sahip = w.fac[bol.sahip];
    switch (karar){
      case 'kuralYaz':
        bol.gelenek = kirp(bol.gelenek + 46, 0, 100);
        bol.huzursuzluk = kirp(bol.huzursuzluk - 18, 0, 100);
        if (sahip) sahip.v.mesruiyet = kirp(sahip.v.mesruiyet + 5, 0.4, 99.6);
        not(`${bol.ad}'nda kuralı kullananlar yazdı. Yavaş işleyecek ama kalıcı.`, { kavram:'ostrom' });
        break;
      case 'bolustur': {
        bol.zenginlik = kirp(bol.zenginlik * 0.7, 0, 100);
        bol.huzursuzluk = kirp(bol.huzursuzluk - 10, 0, 100);
        bol.gelenek = kirp(bol.gelenek * 0.6, 0, 100);
        for (const kb of bol.komsu){ const sh = w.bolgeler[kb].sahip;
          if (w.fac[sh] && w.fac[sh].canli) w.R[sh][bol.sahip] = kirp(w.R[sh][bol.sahip] + 9, -100, 100); }
        not(`${bol.ad} bölüştürüldü. Kavga bitti, toprak küçüldü.`);
        break;
      }
      case 'tekElde': {
        let en = bol.sahip, enG = -1;
        for (const kb of bol.komsu){ const sh = w.bolgeler[kb].sahip;
          if (w.fac[sh] && w.fac[sh].canli && w.fac[sh].v.guc > enG){ enG = w.fac[sh].v.guc; en = sh; } }
        if (en !== bol.sahip && w.fac[bol.sahip]){
          w.fac[bol.sahip].bolgeler = w.fac[bol.sahip].bolgeler.filter(x=>x!==bol.id);
          w.fac[en].bolgeler.push(bol.id);
          w.R[bol.sahip][en] = kirp(w.R[bol.sahip][en] - 34, -100, 100);
          bol.sahip = en;
        }
        bol.gelenek = kirp(bol.gelenek * 0.25, 0, 100);
        bol.huzursuzluk = kirp(bol.huzursuzluk - 14, 0, 100);
        not(`${bol.ad} ${w.fac[bol.sahip].ad}'nın oldu. Düzen geldi, yerel bilgi gitti.`, { kavram:'scott' });
        break;
      }
      case 'kizistir':
        bol.huzursuzluk = kirp(bol.huzursuzluk + 22, 0, 100);
        bol.gelenek = kirp(bol.gelenek * 0.5, 0, 100);
        not(`${bol.ad} alev aldı.`);
        break;
      default:
        bol.huzursuzluk = kirp(bol.huzursuzluk + 9, 0, 100);
        bol.gelenek = kirp(bol.gelenek * 0.85, 0, 100);
        not(m.sureDoldu ? 'Toprak kendi hâline bırakıldı; süre doldu.' : 'Toprak meselesine karışmamayı seçtin.');
    }
    return out;
  }
  return out;
}

/* --- kopuş: hareket yeni bir fraksiyona dönüşür --- */
function fraksiyonEkle(w, ad, kaynak, dogrultu, pay){
  const src = w.fac[kaynak];
  const r = mulberry32(Math.floor(hsh(w.seed+'|fe|'+w.tur+'|'+kaynak)*1e9));
  const f = {
    id: w.fac.length, ad,
    ideoloji: dogrultu.slice(),
    v: {}, taban: {}, mizac: {}, bolgeler: [], canli: true,
    lider: liderUret(r), nufuz:0, ajan:[], sir:[], borc:0, kopukTur: w.tur, anaGovde: kaynak,
    // yeni hanedan: asabiyet taze, nesil sıfır — kopanlar bu yüzden tehlikelidir
    asabiyet: 88, nesil: 0
  };
  for (const v of VARS){
    const alinan = src.v[v] * pay;
    f.v[v] = kirp(v==='ofke' ? Math.max(src.v[v], 55) : Math.max(alinan, 12), 0.4, 99.6);
    f.taban[v] = kirp(src.taban[v] * (v==='ofke' ? 1.25 : 0.85), 8, 90);
    f.mizac[v] = src.mizac[v] * ara(r, 0.8, 1.25);
    if (v !== 'ofke') src.v[v] = kirp(src.v[v] * (1 - pay*0.55), 0.4, 99.6);
  }
  w.fac.push(f);
  // ilişki matrisini büyüt: ana gövdeyle kan davası, gerisi ideolojiden
  for (let i=0;i<w.R.length;i++) w.R[i].push(0);
  w.R.push(new Array(w.fac.length).fill(0));
  const n = w.fac.length - 1;
  for (let i=0;i<n;i++){
    const d = ideolojikMesafe(f, w.fac[i]);
    let taban = Math.round(kirp(72 - d*150, -95, 95));
    if (i === kaynak) taban = -85;
    w.R[n][i] = taban;
    w.R[i][n] = i === kaynak ? -78 : Math.round(kirp(taban*0.8 + (hsh(w.seed+'|fr|'+i)*30-15), -95, 95));
  }
  return f;
}

function kopuslariIsle(w){
  const out = [];
  for (const t of w.tohumlar){
    if (!t.canli || t.kurumsal) continue;
    const host = w.fac[t.fac];
    if (!host || !host.canli) continue;
    const sapma = vekMesafe(t.dogrultu, host.ideoloji);

    /* mesele açılışları */
    const acikMi = (tip)=> w.meseleler.some(m=>m.acik && m.tip===tip && m.ilgili.tohum===t.id);
    if (!t.uyari1 && t.olgunluk >= 45 && t.denetim < 58 && !acikMi('basibos')){
      // mesele açılamadıysa uyarı da harcanmaz: kriz sırasını bekler
      if (meseleAc(w, 'basibos', { tohum:t.id, fac:t.fac })){
        t.uyari1 = true;
        out.push({ tur:w.tur, tip:'meseleAcildi', tohum:t.id, fac:t.fac, kavram:'michels',
          metin: `${t.ad} kendi seçkinini üretmeye başladı. Denetimin %${Math.round(t.denetim)}.` });
      }
    }
    if (!t.uyari2 && t.olgunluk >= 72 && t.denetim < 32 && !acikMi('kopusEsigi')){
      if (meseleAc(w, 'kopusEsigi', { tohum:t.id, fac:t.fac })){
        t.uyari2 = true;
        out.push({ tur:w.tur, tip:'meseleAcildi', tohum:t.id, fac:t.fac, kavram:'kuran',
          metin: `${t.ad} artık düzeni açıkça reddediyor. Gerçek destek %${Math.round(t.gercekDestek)}.` });
      }
    }
    // KURAN çağlayanı: saklanan destek eşiği aşarsa bastırma tersine döner
    if (t.gercekDestek > 62 && t.gercekDestek - t.gorunurDestek > 30 && !acikMi('kirilma')
        && hsh(w.seed+'|kc|'+w.tur+'|'+t.id) < 0.18
        && meseleAc(w, 'kirilma', { tohum:t.id, fac:t.fac })){
      out.push({ tur:w.tur, tip:'meseleAcildi', tohum:t.id, fac:t.fac, kavram:'kuran',
        metin: `${t.ad} için sessizlik çatladı: görünen %${Math.round(t.gorunurDestek)}, gerçek %${Math.round(t.gercekDestek)}.` });
    }

    /* KOPUŞ */
    const olgun = t.olgunluk > 78, kayip = t.denetim < 8, uzak = sapma > 0.30;
    const guclu = t.gercekDestek > 52;
    if (olgun && kayip && uzak && guclu && hsh(w.seed+'|kp|'+w.tur+'|'+t.id) < 0.22){
      const pay = kirp(t.gercekDestek/160, 0.12, 0.45);
      const yeni = fraksiyonEkle(w, t.ad, t.fac, t.dogrultu, pay);
      // bölge de götürebilir
      if (t.bolge != null && w.bolgeler[t.bolge] && w.bolgeler[t.bolge].sahip === t.fac && t.gercekDestek > 66){
        host.bolgeler = host.bolgeler.filter(x=>x!==t.bolge);
        yeni.bolgeler.push(t.bolge); w.bolgeler[t.bolge].sahip = yeni.id;
      }
      host.v.mesruiyet = kirp(host.v.mesruiyet - 12, 0.4, 99.6);
      host.v.istikrar  = kirp(host.v.istikrar - 10, 0.4, 99.6);
      t.canli = false; t.son = 'kopus'; t.evre = 'kopuş'; t.kopanFac = yeni.id;
      out.push({ tur:w.tur, tip:'kopus', tohum:t.id, fac:t.fac, yeniFac:yeni.id, kavram:'michels',
        metin: `${t.ad} koptu ve kendi başına bir güç oldu. Senin eserindi.` });
    }
  }
  return out;
}

/* ================= OYUNCU: GİZLİ EL =================
 * Oyuncu hiçbir fraksiyonu yönetmez. İki kaynağı vardır:
 *   nüfuz — harcanır, yavaş dolar
 *   ifşa  — birikir, silinmez; 100'e varırsa oyun biter
 * Her fiil ikisini de tüketir. Asıl kısıt nüfuz değil, ifşadır.
 */
const FIILLER = {
  incele:   { ad:'İncele',          nufuz:3, ifsa:0.4, kavram:null },
  fisilda:  { ad:'Fısılda',         nufuz:2, ifsa:1.0, kavram:'vekil' },
  ajan:     { ad:'Ajan yerleştir',  nufuz:4, ifsa:1.5, kavram:'vekil' },
  koru:     { ad:'Koru',            nufuz:3, ifsa:0.8, kavram:null },
  finanse:  { ad:'Finanse et',      nufuz:4, ifsa:1.5, kavram:'tocqueville' },
  sizdir:   { ad:'Sızdır',          nufuz:2, ifsa:1.7, kavram:'scott' },
  kiskirt:  { ad:'Kışkırt',         nufuz:3, ifsa:2.4, kavram:'olson' },
  tohum:    { ad:'Tohum ek',        nufuz:5, ifsa:1.0, kavram:'michels' },
  kehanet:  { ad:'Kehanet',         nufuz:4, ifsa:2.0, kavram:'merton' },
  ifsaEt:   { ad:'İfşa et',         nufuz:3, ifsa:2.9, kavram:'girard' }
};

/* ================= DOKTRİN =================
 * Oyuncunun amacı. Hangi dünya durumunun "iyi" olduğunu doktrin tanımlar
 * ve aynı doktrin nüfuzunu besler: dünya sana benzedikçe güçlenirsin.
 * Bu yüzden doktrinine aykırı her hamle iki kez pahalıdır.
 */
function _canli(w){ return w.fac.filter(f=>f.canli); }
function _sapma(xs){
  if (!xs.length) return 0;
  const m = xs.reduce((a,b)=>a+b,0)/xs.length;
  return Math.sqrt(xs.reduce((a,b)=>a+(b-m)*(b-m),0)/xs.length);
}
const DOKTRINLER = {
  denge: {
    ad: 'Denge', tarif: 'Hiçbir güç ötekini ezmesin.',
    puan(w){ const F=_canli(w); if(F.length<2) return 0;
      return kirp(100 - _sapma(F.map(f=>f.v.guc))*3.2 - Math.max(0, F.length<4 ? (4-F.length)*15 : 0), 0, 100); }
  },
  bilgelik: {
    ad: 'Bilgelik', tarif: 'Dünya bilsin ve öfkelenmesin.',
    puan(w){ const F=_canli(w); if(!F.length) return 0;
      const b=F.reduce((a,f)=>a+f.v.bilgi,0)/F.length, o=F.reduce((a,f)=>a+f.v.ofke,0)/F.length;
      return kirp(b*1.15 - o*0.85, 0, 100); }
  },
  dirlik: {
    ad: 'Dirlik', tarif: 'Kimin elinde olduğu önemli değil; halk rahat etsin.',
    puan(w){ const F=_canli(w); if(!F.length) return 0;
      const sv=F.reduce((a,f)=>a+f.v.servet,0)/F.length, is=F.reduce((a,f)=>a+f.v.istikrar,0)/F.length;
      const hz=w.bolgeler.reduce((a,b)=>a+b.huzursuzluk,0)/(w.bolgeler.length||1);
      return kirp(sv*0.55 + is*0.55 - hz*0.35, 0, 100); }
  },
  cozulme: {
    ad: 'Çözülme', tarif: 'Büyük olan hiçbir şey ayakta kalmasın.',
    puan(w){ const F=_canli(w); if(!F.length) return 0;
      const enBuyuk = Math.max(...F.map(f=>f.bolgeler.length));
      const ort = w.bolgeler.length / F.length;
      return kirp(F.length*9 - (enBuyuk-ort)*11, 0, 100); }
  },
  arilik: {
    ad: 'Arılık', tarif: 'Tek bir fikir dünyaya sinsin.',
    puan(w){ const F=_canli(w); if(F.length<2) return 0;
      let top=0, n=0;
      for(let i=0;i<F.length;i++) for(let j=i+1;j<F.length;j++){ top+=ideolojikMesafe(F[i],F[j]); n++; }
      return kirp(100 - (top/(n||1))*190, 0, 100); }
  },
  sureklilik: {
    ad: 'Süreklilik', tarif: 'Aynı el hep üstte kalsın — kim olduğu fark etmez.',
    puan(w){ const F=_canli(w); if(!F.length) return 0;
      const s2 = F.map((f)=>({f,s:skor(f)})).sort((a,b)=>b.s-a.s);
      const E = w.el;
      if (!E) return 0;
      if (E.sonUst === s2[0].f.id) E.ustSure = (E.ustSure||0)+1; else { E.sonUst = s2[0].f.id; E.ustSure = 0; }
      // sallantılı üstünlük süreklilik sayılmaz
      const fark = s2.length>1 ? s2[0].s - s2[1].s : 30;
      return kirp((E.ustSure||0)*1.0 - (fark < 6 ? 25 : 0), 0, 100); }
  }
};

function hizalanma(w){
  if (!w.el || !w.el.doktrin) return 50;
  return DOKTRINLER[w.el.doktrin].puan(w);
}

function oyuncuKur(w, ayar){
  w.el = {
    doktrin: (ayar && ayar.doktrin) || 'denge',
    nufuz: 10, ifsa: 0, hiz: 50, hizGecmis: [],
    ajanlar: [], sirlar: [], kehanetler: [],
    asinma: {},            // GOODHART: (fiil|hedef) → yıpranma
    bilinen: [],           // keşfedilmiş kanunların id'leri
    bilinenDoga: [],       // doğası (taban + mizaç) çözülmüş fraksiyonlar
    gunluk: [], av: 0,     // av: seni arayan fraksiyonların toplam dikkati
    bitti: false, bitisSebebi: null
  };
  return w.el;
}

/* --- GOODHART: aynı kaldıraca basmak onu kaldıraç olmaktan çıkarır --- */
function asinmaAnahtar(fiil, hedef){ return fiil + '|' + (hedef == null ? '-' : hedef); }
// İfşa riski dünyaya bağlıdır: bilgisi yüksek bir fraksiyona dokunmak
// seni ele verir; orada olgun bir ajanın varsa iz örtülür.
function ifsaCarpani(w, fac){
  if (fac == null || !w.fac[fac]) return 1;
  const f = w.fac[fac];
  const ajan = w.el && w.el.ajanlar.some(a=>a.fac===fac && a.olgun && !a.yakalandi);
  return (0.5 + f.v.bilgi/115) * (ajan ? 0.72 : 1) * (f.korunma > 0 ? 1.15 : 1);
}

function etkinlik(w, fiil, hedef){
  const a = w.el.asinma[asinmaAnahtar(fiil, hedef)] || 0;
  return 1 / (1 + Math.pow(a, 1.3) * 0.38);
}
function asindir(w, fiil, hedef){
  const k = asinmaAnahtar(fiil, hedef);
  w.el.asinma[k] = (w.el.asinma[k] || 0) + 1;
}

/* Bir kanunun şu an o fraksiyona ne yaptığı. Yalnızca İNCELENMİŞ kanunlar
 * için anlamlıdır: bilgi, gözle görülür bir güce dönüşür. */
function kanunKatkisi(w, i, k){
  const a = kapsamDeger(w, i, k.kaynak, k.kapsam);
  const b = k.kaynak2 ? kapsamDeger(w, i, k.kaynak2, k.kapsam) : 0;
  const olc = w.olcek ? w.olcek[k.hedef] : 1;
  return k.kat * sekilDeger(k, a, b) * w.fac[i].mizac[k.hedef] * olc;
}

/* Bir fraksiyonun bir değişkende geri döndüğü kuvvet. Yalnızca doğası
 * çözülmüşse hesaplanabilir — kanunları bilmek tek başına yetmez. */
function dogaKuvveti(w, i, vr){
  if (!w.el || w.el.bilinenDoga.indexOf(i) < 0) return null;
  return (w.fac[i].taban[vr] - w.fac[i].v[vr]) * (w.cekim + 0.024);
}

/* Kehanetin DAYANAĞI: o değişkeni besleyen kaç kanunu incelemişsin ve
 * orada gözün var mı? Dayanaksız kehanet ucuz ve tehlikelidir. */
function kehanetDayanak(w, fac, vr){
  if (!w.el) return { kanunlar: [], ajan: false, guc: 0 };
  const kanunlar = w.kanunlar.filter(k => k.hedef === vr && w.el.bilinen.indexOf(k.id) >= 0);
  const ajan = w.el.ajanlar.some(a => a.fac === fac && a.olgun && !a.yakalandi);
  const toplam = w.kanunlar.filter(k => k.hedef === vr).length || 1;
  const doga = w.el.bilinenDoga.indexOf(fac) >= 0;
  const guc = kirp(kanunlar.length / toplam * 0.55 + (doga ? 0.25 : 0) + (ajan ? 0.20 : 0), 0, 1);
  return { kanunlar, ajan, doga, guc: +guc.toFixed(2) };
}

/* --- meşru hamlelerin tamamı --- */
function hamleler(w){
  const L = [], E = w.el;
  const canli = w.fac.map((f,i)=>({f,i})).filter(x=>x.f.canli);
  const ajanli = (i)=> E.ajanlar.some(a=>a.fac===i && a.olgun);
  const ek = (fiil, hedef, etiket, ayrinti)=>{
    const F = FIILLER[fiil];
    const et = etkinlik(w, fiil, hedef);
    const ic = ifsaCarpani(w, (ayrinti && ayrinti.fac != null) ? ayrinti.fac : null);
    L.push(Object.assign({ fiil, hedef, etiket, nufuz:F.nufuz, ifsa:+(F.ifsa*(2-et)*ic).toFixed(2),
                           etkinlik:+et.toFixed(2), karsilanir: E.nufuz >= F.nufuz }, ayrinti||{}));
  };

  // İNCELE — dünyanın gizli kanunlarını öğren (araştırma döngüsü)
  for (const k of w.kanunlar) if (E.bilinen.indexOf(k.id) < 0)
    ek('incele', 'k'+k.id, `${VAD[k.hedef]} kanunlarından birini incele`, { kanun:k.id });
  // Kanunlar dünyanın fiziği; doğa ise fraksiyonun nereye geri döneceği.
  // İkisini bilmeden hiçbir şey öngörülemez.
  for (const {f,i} of canli) if (E.bilinenDoga.indexOf(i) < 0)
    ek('incele', 'd'+i, `${f.ad}'nın doğasını çöz`, { fac:i, doga:true });

  for (const {f,i} of canli){
    ek('ajan',    i, `${f.ad} içine ajan yerleştir`, { fac:i });
    ek('finanse', i, `${f.ad} gizlice finanse edilsin`, { fac:i });
    ek('kiskirt', i, `${f.ad} kışkırtılsın`, { fac:i });
    ek('koru',    i, `${f.ad} korunsun`, { fac:i });
    if (ajanli(i)) ek('fisilda', i, `${f.lider.ad} kulağına fısılda`, { fac:i });
    // KEHANET — geleceğe dair bir iddia; tutarsa nüfuz, tutmazsa ifşa
    for (const v of VARS){
      const dy = kehanetDayanak(w, i, v);
      for (const yon of ['yukselecek','dusecek'])
        ek('kehanet', i+'|'+v+'|'+yon,
           `Kehanet: ${f.ad} — ${VAD[v]} ${yon}` +
           `  [dayanak: ${dy.kanunlar.length} kanun${dy.doga ? ' + doğa' : ''}` +
           (dy.guc >= 0.5 ? ', sağlam]' : (dy.guc > 0 ? ']' : 'sız]')),
           { fac:i, vr:v, yon, dayanak:dy.kanunlar.length, dayanakGucu:dy.guc });
    }
    // TOHUM — katman × amaç
    for (const kat in KATMANLAR) for (const am in AMACLAR)
      ek('tohum', i+'|'+kat+'|'+am,
         `${f.ad} · ${KATMANLAR[kat].ad} katmanına ${AMACLAR[am].ad} ek`,
         { fac:i, katman:kat, amac:am });
  }

  // SIZDIR / İFŞA ET — çiftler
  for (const {f:a,i} of canli) for (const {f:b,i:j} of canli){
    if (i===j) continue;
    if (ajanli(i)) ek('sizdir', i+'>'+j, `${a.ad}'nın bildiğini ${b.ad} da öğrensin`, { fac:i, hedefFac:j });
  }
  for (const sir of E.sirlar){
    if (sir.kullanildi) continue;
    for (const {f:b,i:j} of canli){
      if (j===sir.fac) continue;
      ek('ifsaEt', sir.id+'>'+j, `${w.fac[sir.fac].ad} hakkındaki sırrı ${b.ad}'na ver`,
         { sir:sir.id, fac:sir.fac, hedefFac:j });
    }
  }
  return L;
}

function hamleYap(w, h){
  const E = w.el, out = [];
  const F = FIILLER[h.fiil];
  if (!F) return out;
  if (E.nufuz < F.nufuz) return [{ tur:w.tur, tip:'ret', metin:'Nüfuzun yetmiyor.' }];
  const et = etkinlik(w, h.fiil, h.hedef);
  E.nufuz -= F.nufuz;
  E.ifsa   = kirp(E.ifsa + F.ifsa * (2 - et) * ifsaCarpani(w, h.fac), 0, 100);
  asindir(w, h.fiil, h.hedef);
  const not = (metin, ek)=> out.push(Object.assign({ tur:w.tur, tip:'el', fiil:h.fiil, metin }, ek||{}));
  const f = h.fac != null ? w.fac[h.fac] : null;

  switch (h.fiil){
    case 'incele': {
      if (h.doga){
        if (E.bilinenDoga.indexOf(h.fac) < 0) E.bilinenDoga.push(h.fac);
        const tb = VARS.map(v=>`${VAD[v]} ${Math.round(f.taban[v])}`).join(' · ');
        not(`${f.ad}'nın doğası çözüldü — geri döndüğü noktalar: ${tb}`, { fac:h.fac });
      } else {
        const k = w.kanunlar[h.kanun];
        if (k && E.bilinen.indexOf(k.id) < 0) E.bilinen.push(k.id);
        not(`Bir kanun açığa çıktı: ${kanunMetni(k)}`, { kanun:k.id });
      }
      break;
    }
    case 'ajan':
      E.ajanlar.push({ id:E.ajanlar.length, fac:h.fac, dikildi:w.tur, olgun:false, yakalandi:false });
      not(`${f.ad} içine bir ajan yerleştirildi. Olgunlaşması zaman alır.`, { kavram:'vekil' });
      break;
    case 'fisilda':
      f.lider.kusku = kirp(f.lider.kusku + 9*et, 0, 100);
      f.v.istikrar  = kirp(f.v.istikrar - 3*et, 0.4, 99.6);
      not(`${f.lider.ad} artık çevresine daha az güveniyor.`);
      break;
    case 'koru':
      f.korunma = (f.korunma || 0) + 6*et;
      not(`${f.ad} bir süre korunuyor.`);
      break;
    case 'finanse':
      f.v.servet = kirp(f.v.servet + 7*et, 0.4, 99.6);
      not(`${f.ad} kasasına sessizce para aktı.`, { kavram:'tocqueville' });
      break;
    case 'kiskirt': {
      // OLSON: küçük ve yoğun gruplar örgütlenir, geniş kalabalık örgütlenmez
      const akim = w.tohumlar.find(t=>t.canli && t.fac===h.fac);
      const yogunluk = akim ? (1.45 - (akim.katman==='halk' ? 0.75 : 0)) : 0.7;
      f.v.ofke = kirp(f.v.ofke + 9*et*yogunluk, 0.4, 99.6);
      f.v.istikrar = kirp(f.v.istikrar - 4*et*yogunluk, 0.4, 99.6);
      not(`${f.ad} kışkırtıldı.` + (yogunluk < 0.8 ? ' Kalabalık dağınık; öfke dağılıyor.' : ''),
          { kavram:'olson' });
      break;
    }
    case 'tohum': {
      const t = tohumEk(w, { fac:h.fac, katman:h.katman, amac:h.amac, bolge:f.bolgeler[0] });
      not(`${f.ad} içinde ${KATMANLAR[h.katman].ad} katmanına ${AMACLAR[h.amac].ad} ekildi: ${t.ad}.`,
          { tohum:t.id, kavram:'michels' });
      break;
    }
    case 'sizdir': {
      // SCOTT: merkez görebilmek için basitleştirir; gördüğü şey artık o şey değildir
      const b = w.fac[h.hedefFac];
      b.v.bilgi = kirp(b.v.bilgi + 6*et, 0.4, 99.6);
      f.v.bilgi = kirp(f.v.bilgi - 2*et, 0.4, 99.6);
      w.R[h.fac][h.hedefFac] = kirp(w.R[h.fac][h.hedefFac] - 8*et, -100, 100);
      not(`${f.ad}'nın bildiği ${b.ad}'na ulaştı.`, { kavram:'scott' });
      break;
    }
    case 'ifsaEt': {
      const sir = E.sirlar.find(x=>x.id===h.sir);
      const b = w.fac[h.hedefFac];
      if (sir) sir.kullanildi = true;
      const agirlik = sir ? sir.agirlik : 6;
      f.v.mesruiyet = kirp(f.v.mesruiyet - agirlik*et, 0.4, 99.6);
      w.R[h.hedefFac][h.fac] = kirp(w.R[h.hedefFac][h.fac] - agirlik*2.2*et, -100, 100);
      b.v.bilgi = kirp(b.v.bilgi + 4*et, 0.4, 99.6);
      not(`${b.ad}, ${f.ad} hakkındaki sırrı öğrendi.`, { kavram:'girard' });
      break;
    }
    case 'kehanet': {
      const baslangic = f.v[h.vr];
      const dy = kehanetDayanak(w, h.fac, h.vr);
      E.kehanetler.push({ id:E.kehanetler.length, fac:h.fac, vr:h.vr, yon:h.yon,
                          baslangic, acilis:w.tur, vade:w.tur+12, cozuldu:false,
                          dayanak:dy.kanunlar.length, dayanakGucu:dy.guc });
      // MERTON: ilan edilmiş kehanet, ona göre davranıldığı için kendini besler.
      // Kanunu bilen, hangi kaldıraca bastığını da bilir: itişi daha isabetli olur.
      const itis = (h.yon==='yukselecek' ? 1 : -1) * 1.6 * et * (1 + dy.guc*0.8);
      f.v[h.vr] = kirp(f.v[h.vr] + itis, 0.4, 99.6);
      not(`Kehanet ilan edildi: ${f.ad} — ${VAD[h.vr]} ${h.yon}. Vade 12 mevsim.` +
          (dy.kanunlar.length ? ` ${dy.kanunlar.length} kanuna dayanıyor.` : ' Dayanaksız.'),
          { kavram:'merton' });
      break;
    }
  }
  E.gunluk.push({ tur:w.tur, fiil:h.fiil, hedef:h.hedef, etkinlik:+et.toFixed(2) });
  return out;
}

/* --- oyuncunun turu: kaynak, ajanlar, kehanetler, av --- */
function eliIsle(w){
  const E = w.el, out = [];
  if (!E || E.bitti) return out;

  // nüfuz: kurumsallaşmış akımlar ve olgun ajanlar besler
  const kurumsal = w.tohumlar.filter(t=>t.canli && t.kurumsal).length;
  const olgunAjan = E.ajanlar.filter(a=>a.olgun && !a.yakalandi).length;
  // Dünya doktrinine benzedikçe güçlenirsin: amaç ve motor aynı şeydir
  E.hiz = hizalanma(w);
  E.hizGecmis.push(Math.round(E.hiz));
  if (E.hizGecmis.length > 400) E.hizGecmis.shift();
  // hizalanma keskin: doktrinine aykırı giden dünya seni aç bırakır
  const besin = 0.5 + Math.pow(E.hiz/100, 1.4) * 3.4;
  E.nufuz = Math.min(24, E.nufuz + besin + kurumsal*0.85 + olgunAjan*0.45 - E.ifsa/70);

  // ifşa yavaş söner ama sıfırlanmaz
  E.ifsa = kirp(E.ifsa - (1.15 + (E.ifsa>60 ? 0.5 : 0)), 0, 100);

  // GOODHART yıpranması çok yavaş iyileşir
  for (const k in E.asinma) E.asinma[k] = Math.max(0, E.asinma[k] - 0.035);

  // ajanlar olgunlaşır, sır üretir, yakalanabilir
  for (const a of E.ajanlar){
    if (a.yakalandi) continue;
    const f = w.fac[a.fac];
    if (!f || !f.canli){ a.yakalandi = true; continue; }
    const yas = w.tur - a.dikildi;
    if (!a.olgun && yas >= 6){
      a.olgun = true;
      out.push({ tur:w.tur, tip:'el', metin:`${f.ad} içindeki ajanın artık işe yarar.` });
    }
    if (a.olgun && hsh(w.seed+'|sr|'+w.tur+'|'+a.id) < 0.09){
      const sir = { id:E.sirlar.length, fac:a.fac, agirlik:Math.round(ara(()=>hsh(w.seed+'|sa|'+w.tur+'|'+a.id),4,11)),
                    bulundu:w.tur, kullanildi:false };
      E.sirlar.push(sir);
      out.push({ tur:w.tur, tip:'el', sir:sir.id,
        metin:`${f.ad} hakkında bir sır elinde: ağırlık ${sir.agirlik}.` });
    }
    // yakalanma: fraksiyonun bilgisi ve senin ifşan yükseldikçe
    const risk = (f.v.bilgi/100)*0.022 + E.ifsa/2600;
    if (a.olgun && hsh(w.seed+'|ay|'+w.tur+'|'+a.id) < risk){
      a.yakalandi = true;
      E.ifsa = kirp(E.ifsa + 9, 0, 100);
      out.push({ tur:w.tur, tip:'el', metin:`${f.ad} ajanını yakaladı. İzin daha da belirginleşti.` });
    }
  }

  // kehanetler vadesinde çözülür
  for (const kh of E.kehanetler){
    if (kh.cozuldu || w.tur < kh.vade) continue;
    kh.cozuldu = true;
    const f = w.fac[kh.fac];
    const simdi = f && f.canli ? f.v[kh.vr] : 0;
    const fark = simdi - kh.baslangic;
    const tuttu = (kh.yon==='yukselecek' && fark > 3) || (kh.yon==='dusecek' && fark < -3);
    kh.tuttu = tuttu; kh.fark = +fark.toFixed(1);
    const dg = kh.dayanakGucu || 0;
    if (tuttu){
      // dayanaklı kehanet daha çok kazandırır; dayanaksız tutarsa şans sayılır
      E.nufuz = Math.min(24, E.nufuz + 5 + 11*dg);
      E.ifsa  = kirp(E.ifsa - (2 + 4*dg), 0, 100);
      out.push({ tur:w.tur, tip:'el', kavram:'merton',
        metin:`Kehanet tuttu: ${f.ad} — ${VAD[kh.vr]} ${kh.yon} (${fark>0?'+':''}${fark.toFixed(1)}). Görünmez el güçlendi.` });
    } else {
      // dayanaksız yanlış kehanet daha çok yakar
      E.ifsa = kirp(E.ifsa + 9 - 4*dg, 0, 100);
      out.push({ tur:w.tur, tip:'el', kavram:'merton',
        metin:`Kehanet tutmadı: ${f && f.canli ? f.ad : 'fraksiyon'} — ${VAD[kh.vr]} ${kh.yon} (${fark>0?'+':''}${fark.toFixed(1)}). Yalancı peygamber fark edilir.` });
    }
  }

  // korunma söner
  for (const f of w.fac) if (f.korunma) f.korunma = Math.max(0, f.korunma - 1.5);

  // AV: bilgisi yüksek fraksiyonlar izi sürer
  let dikkat = 0;
  for (const f of w.fac) if (f.canli) dikkat += Math.max(0, f.v.bilgi - 58) / 100;
  E.av = kirp(E.av + dikkat * (E.ifsa/55) - 0.25, 0, 100);

  if (E.ifsa >= 100 || E.av >= 100){
    E.bitti = true;
    E.bitisSebebi = E.ifsa >= 100 ? 'ifsa' : 'av';
    out.push({ tur:w.tur, tip:'son',
      metin: E.bitisSebebi === 'ifsa'
        ? 'Artık görünüyorsun. Gizli el kalmadı.'
        : 'İzini sürdüler ve buldular.' });
  }
  return out;
}

/* ================= DOSYA =================
 * Bir mesele açıldığında oyuncuya rakam verilmez; DOSYA verilir.
 * Dosyanın kalitesi oyuncunun önceden yaptığı yatırıma bağlıdır:
 * yerinde olgun bir ajanın varsa tanıklıklar isabetli, yoksa dosya
 * kulaktan dolma söylentiyle dolar. Kararın zorluğu buradan gelir.
 */
// erisim: bu kaynak ne kadar gizli şeyi görebilir (0-1). Sokak, sarayın
// içini göremez; kronik yalnızca olup bitmiş görünür şeyleri anlatır.
const KAYNAKLAR = {
  yerinde: { ad:'Yerinde', etiket:'içeriden, olgun ajan',   hata:4,  yalan:0.04, agirlik:5, erisim:1.00 },
  kurum:   { ad:'Kurum',   etiket:'kurumsallaşmış akımdan', hata:9,  yalan:0.12, agirlik:4, erisim:0.72 },
  rakip:   { ad:'Rakip',   etiket:'düşmanının anlattığı',   hata:15, yalan:0.36, agirlik:2, erisim:0.55 },
  sokak:   { ad:'Sokak',   etiket:'kulaktan dolma',         hata:25, yalan:0.32, agirlik:1, erisim:0.45 },
  kronik:  { ad:'Kronik',  etiket:'kendi gözlemin',         hata:3,  yalan:0.00, agirlik:5, erisim:0.32 }
};

function _kaynaklar(w, fac){
  const E = w.el, out = ['sokak', 'kronik'];
  if (E){
    if (E.ajanlar.some(a=>a.fac===fac && a.olgun && !a.yakalandi)) out.unshift('yerinde');
    if (w.tohumlar.some(t=>t.canli && t.kurumsal && t.fac===fac)) out.push('kurum');
  }
  for (let j=0;j<w.fac.length;j++)
    if (j!==fac && w.fac[j].canli && w.R[j][fac] < -30){ out.push('rakip'); break; }
  return out;
}

// Bir olguyu hangi kaynaklar görebilir? Gizlilik arttıkça liste kısalır;
// en gizli olgu (halkın gerçek desteği) yalnızca içerideki ajanla bilinir.
function _yetkin(kaynaklar, gizlilik){
  return kaynaklar.filter(k => KAYNAKLAR[k].erisim >= gizlilik);
}

function _bozulmus(w, kaynak, gercek, tuz){
  const K = KAYNAKLAR[kaynak];
  const z1 = hsh(w.seed+'|dz|'+w.tur+'|'+tuz+'|a');
  const z2 = hsh(w.seed+'|dz|'+w.tur+'|'+tuz+'|b');
  const yalanMi = z2 < K.yalan;
  let v = gercek + (z1*2-1) * K.hata;
  if (yalanMi) v = gercek + (gercek > 50 ? -1 : 1) * (18 + z1*26);
  return { deger: kirp(v, 0, 100), dogru: !yalanMi && Math.abs(v-gercek) <= K.hata };
}

  }
  return t
    ? `${f.ad} içinde ${KATMANLAR[t.katman].ad} katmanına ektiğin ${AMACLAR[t.amac].ad}, ` +
      `${w.tur - t.dogum} mevsimdir büyüyor. Artık bir ${t.evre}.`
    : `${f.ad} hakkında karar vermen gerekiyor.`;
}

function dosyaUret(w, meseleId){
  const m = w.meseleler[meseleId];
  if (!m) return null;
  const t = m.ilgili.tohum != null ? w.tohumlar[m.ilgili.tohum] : null;
  const f = t ? w.fac[t.fac]
            : (m.ilgili.fac != null ? w.fac[m.ilgili.fac]
               : (m.ilgili.bolge != null ? w.fac[w.bolgeler[m.ilgili.bolge].sahip] : null));
  if (!f) return null;
  const kaynaklar = _kaynaklar(w, f.id);
  const sapmaGercek = t ? vekMesafe(t.dogrultu, f.ideoloji) * 100 / 0.6 : 0;
  let disGercek = 0;
  for (let j=0;j<w.fac.length;j++) if (j!==f.id && w.fac[j].canli && w.R[j][f.id] > 45) disGercek += 30;

  const gercekler = _dosyaOlgular(w, m, t, f, sapmaGercek, disGercek);


  const tanikliklar = [], olcumler = [], karanlik = [];
  gercekler.forEach((g, i) => {
    const uygun = _yetkin(kaynaklar, g.gizlilik);
    if (!uygun.length){
      karanlik.push(g.ad);
      olcumler.push({ ad:g.ad, aralik:'bilinmiyor', kaynak:'—', agirlik:0 });
      return;
    }
    // oyuncu doğal olarak en iyi kaynağına kulak verir
    const enIyi = uygun.slice().sort((a,b)=>KAYNAKLAR[b].agirlik-KAYNAKLAR[a].agirlik);
    const kn = hsh(w.seed+'|dk|'+w.tur+'|'+meseleId+'|'+i) < 0.7
      ? enIyi[0]
      : enIyi[Math.floor(hsh(w.seed+'|dk2|'+w.tur+'|'+meseleId+'|'+i)*enIyi.length)];
    const K = KAYNAKLAR[kn];
    const b = _bozulmus(w, kn, g.gercek, meseleId+'|'+i);
    tanikliklar.push({ konu:g.tur, baslik:g.ad, kaynak:kn, kaynakAd:K.ad, etiket:K.etiket,
                       agirlik:K.agirlik, metin:_iddiaMetni(g.tur, b.deger, meseleId+'|'+i, w),
                       _dogru:b.dogru });
    olcumler.push({ ad:g.ad, aralik:_aralik(b.deger, K.hata), kaynak:K.ad, agirlik:K.agirlik });
  });

  // ÇELİŞKİ: aynı konuda iki kaynak, biri yanılıyor
  const celiskiler = [];
  for (let i=0;i<tanikliklar.length;i++){
    if (hsh(w.seed+'|dc|'+w.tur+'|'+meseleId+'|'+i) > 0.34) continue;
    const g = gercekler.find(x=>x.tur === tanikliklar[i].konu);
    if (!g) continue;
    const k2 = _yetkin(kaynaklar, g.gizlilik).filter(k=>k!==tanikliklar[i].kaynak);
    if (!k2.length) continue;
    const kn = k2[Math.floor(hsh(w.seed+'|dc2|'+w.tur+'|'+meseleId+'|'+i)*k2.length)];
    const b = _bozulmus(w, kn, g.gercek, meseleId+'|c'+i);
    // çelişki ancak farklı kovaya düşerse anlamlı
    const kova = x => x>=62?2:(x>=34?1:0);
    const ilk = tanikliklar[i];
    if (kova(b.deger) === kova(g.gercek) && ilk._dogru) continue;
    celiskiler.push({ konu:g.tur, baslik:g.ad,
      a:{ kaynakAd:KAYNAKLAR[ilk.kaynak].ad, etiket:ilk.etiket, metin:ilk.metin, agirlik:ilk.agirlik },
      b:{ kaynakAd:KAYNAKLAR[kn].ad, etiket:KAYNAKLAR[kn].etiket,
          metin:_iddiaMetni(g.tur, b.deger, meseleId+'|c'+i, w), agirlik:KAYNAKLAR[kn].agirlik } });
  }

  return {
    meseleId, baslik: m.baslik, kalanMevsim: meselePencere(w, m),
    konu: t ? t.ad : f.ad, fraksiyon: f.ad,
    katman: t ? KATMANLAR[t.katman].ad : null,
    amac: t ? AMACLAR[t.amac].ad : null,
    girizgah: _girizgah(w, m, t, f),
    kaynakDurumu: kaynaklar.map(k=>({ ad:KAYNAKLAR[k].ad, etiket:KAYNAKLAR[k].etiket, agirlik:KAYNAKLAR[k].agirlik })),
    yerindeVar: kaynaklar.indexOf('yerinde') >= 0,
    tanikliklar, olcumler, celiskiler, karanlik,
    secenekler: m.secenekler.map(k=>Object.assign({ anahtar:k }, SECENEK_TARIF[k]))
  };
}

// Dosya kapandıktan sonra okunacaklar
function kutuphaneEkle(w, kavram){
  if (!w.el) return null;
  if (!w.el.kutuphane) w.el.kutuphane = [];
  if (!KAVRAMLAR[kavram]) return null;
  if (w.el.kutuphane.indexOf(kavram) < 0) w.el.kutuphane.push(kavram);
  return KAVRAMLAR[kavram];
}

/* ================= GÖRÜNÜRLÜK =================
 * Oyuncu hak etmediği rakamı görmez. Aynı fraksiyon, istihbarat konumuna
 * göre üç ayrı şekilde görünür:
 *   0 — kaynak yok   : yalnızca dışarıdan görüleni, kelimeyle
 *   1 — doğası çözülmüş ya da kurumun var : hepsi kelimeyle + gidişat
 *   2 — olgun ajan   : kesin rakam + gidişat
 */
const SOZ = {
  guc:       ['çok zayıf','zayıf','orta','güçlü','çok güçlü'],
  servet:    ['yoksul','dar','idare eder','varlıklı','zengin'],
  istikrar:  ['dağılıyor','sarsak','durağan','sağlam','çok sağlam'],
  mesruiyet: ['tanınmıyor','tartışmalı','kabul görüyor','saygın','sorgulanmaz'],
  bilgi:     ['karanlıkta','az bilir','vasat','bilgili','çok bilgili'],
  ofke:      ['sakin','homurdanıyor','gergin','öfkeli','kaynıyor']
};
// dışarıdan çıplak gözle görülebilenler
const ACIK_VARS = ['guc','servet','ofke'];

function _sozBandi(vr, x){
  const i = x < 20 ? 0 : (x < 40 ? 1 : (x < 62 ? 2 : (x < 82 ? 3 : 4)));
  return SOZ[vr][i];
}

function bilgiSeviyesi(w, fac){
  const E = w.el;
  if (!E) return 0;
  if (E.ajanlar.some(a=>a.fac===fac && a.olgun && !a.yakalandi)) return 2;
  if (E.bilinenDoga.indexOf(fac) >= 0) return 1;
  if (w.tohumlar.some(t=>t.canli && t.kurumsal && t.fac===fac)) return 1;
  return 0;
}

function gidisat(w, fac, vr){
  const f = w.fac[fac];
  if (!f || !f.gecmis6 || f.gecmis6[vr] === undefined) return null;
  const d = f.v[vr] - f.gecmis6[vr];
  if (d > 2.5) return 'artıyor';
  if (d < -2.5) return 'azalıyor';
  return 'duruyor';
}

function gorunum(w, fac, vr){
  const sv = bilgiSeviyesi(w, fac);
  const f = w.fac[fac];
  if (!f) return { seviye:0, bilinmiyor:true };
  if (sv === 0 && ACIK_VARS.indexOf(vr) < 0) return { seviye:0, bilinmiyor:true };
  const o = { seviye:sv, soz:_sozBandi(vr, f.v[vr]) };
  if (sv >= 1) o.gidisat = gidisat(w, fac, vr);
  if (sv >= 2) o.tam = Math.round(f.v[vr]);
  return o;
}

function bolgeGorunum(w, bolgeId){
  const b = w.bolgeler[bolgeId];
  if (!b) return null;
  // coğrafya ve sahiplik herkesçe bilinir; içerisi bilinmez
  const o = { id:b.id, ad:b.ad, sahip:b.sahip, sahipAd: w.fac[b.sahip] ? w.fac[b.sahip].ad : '—',
              ortak: !!b.ortak, komsu: b.komsu.slice(), seviye: bilgiSeviyesi(w, b.sahip) };
  if (o.seviye >= 1){
    o.zenginlikSoz   = _sozBandi('servet', b.zenginlik);
    o.huzursuzlukSoz = _sozBandi('ofke', b.huzursuzluk);
    o.kuralVar = !!b.yerelKural;
  }
  if (o.seviye >= 2){
    o.zenginlik = Math.round(b.zenginlik);
    o.huzursuzluk = Math.round(b.huzursuzluk);
    o.gelenek = Math.round(b.gelenek);
  }
  return o;
}

// İfşa rakamla değil kelimeyle: oyuncu optimize etmesin, tartsın
const IZ_SOZ = [[8,'yok'],[22,'silik'],[42,'seçiliyor'],[62,'belirgin'],[82,'tehlikeli'],[101,'açıkta']];
function izSozu(ifsa){ for (const [u,s] of IZ_SOZ) if (ifsa < u) return s; return 'açıkta'; }
function hizSozu(h){
  if (h >= 78) return 'dünya sana benziyor';
  if (h >= 58) return 'dünya sana yaklaşıyor';
  if (h >= 38) return 'dünya kayıtsız';
  if (h >= 20) return 'dünya sana yabancı';
  return 'dünya sana karşı';
}

/* ---------- DOĞRULAMA ---------- */
// Üretilen fizik oyuna layık mı? Donuk, çığ gibi, ölü veya kaderi yazılmış
// dünyalar elenir. En kritik sınav: tek bir küçük müdahale, 100 tur sonra
// dünyayı yapısal olarak değiştirebiliyor mu? (kararlar birikmeli)
function durumVektoru(w){
  const o=[];
  for (const f of w.fac) for (const v of VARS) o.push(f.canli ? f.v[v] : 0);
  return o;
}
function yapisalImza(w){
  return { sahip: w.bolgeler.map(b=>b.sahip), lider: w.fac.map(f=>f.lider.ad), canli: w.fac.map(f=>f.canli) };
}
function yapisalFark(a,b){
  let n=0;
  for (let i=0;i<a.sahip.length;i++) if(a.sahip[i]!==b.sahip[i]) n++;
  for (let i=0;i<a.lider.length;i++) if(a.lider[i]!==b.lider[i]) n++;
  for (let i=0;i<a.canli.length;i++) if(a.canli[i]!==b.canli[i]) n++;
  return n;
}

function dogrula(seed, ayar){
  const T = 200, DT = 120;
  const w = dunyaKur(seed, ayar);
  let hareket=0, ornek=0, sabit=0;
  let dv=null, yi=null;
  // ERKEN ELEME: adayların büyük çoğunluğu 60-80. turda zaten belli oluyor.
  // 200 tur koşturmak boşa gidiyordu; bu kapı aramayı belirgin hızlandırır.
  const erkenRet = (sebep)=>({ seed, gecti:false, erken:true, erkenRet:sebep,
    canlilik:0, sabitOran:0, hayatta:0, cesitlilik:0, olay:0, olayTip:0, tekel:1,
    ayrisan:0, cokmus:0, erkenSayi:0, erkenTip:0, sapma:0, enSapma:0, yayilim:0, yapisal:0 });

  for (let t=0;t<T;t++){
    const onc = w.fac.map(f=>VARS.map(v=>f.v[v]));
    adim(w);
    for (let i=0;i<w.fac.length;i++){
      if(!w.fac[i].canli) continue;
      for (let vi=0;vi<VARS.length;vi++){
        const yeni=w.fac[i].v[VARS[vi]];
        if (t>40){ hareket += Math.abs(yeni-onc[i][vi]); ornek++; if (yeni<=2||yeni>=98) sabit++; }
      }
    }
    if (t === 60){
      const e = w.olaylar.filter(o=>o.tur<=60);
      if (e.length < 8 || new Set(e.map(o=>o.tip)).size < 4) return erkenRet('soguk-acilis');
      if (w.olaylar.length > 90) return erkenRet('gurultu');
    }
    if (t === 85){
      if (w.fac.filter(f=>f.canli && skor(f)>12).length < 4) return erkenRet('kirim');
      if (w.olaylar.length > 125) return erkenRet('gurultu');
    }
    if (t===DT-1){ dv=durumVektoru(w); yi=yapisalImza(w); }
  }
  const canlilik = ornek? hareket/ornek : 0;
  const sabitOran = ornek? sabit/ornek : 1;
  const hayatta = w.fac.filter(f=>f.canli && skor(f)>12).length;
  const skorlar = w.fac.filter(f=>f.canli).map(skor);
  const ort = skorlar.reduce((a,b)=>a+b,0)/(skorlar.length||1);
  const cesitlilik = Math.sqrt(skorlar.reduce((a,b)=>a+(b-ort)*(b-ort),0)/(skorlar.length||1));
  const olay = w.olaylar.length;
  const sayac = {};
  for (const o of w.olaylar) sayac[o.tip] = (sayac[o.tip]||0)+1;
  const olayTip = Object.keys(sayac).length;
  // tek bir olay tipi kroniği ele geçirmesin
  const tekel = olay ? Math.max(...Object.values(sayac)) / olay : 1;
  // değişken bazında tekdüzelik: kaç değişkende fraksiyonlar birbirinden ayrışmış?
  const canliF = w.fac.filter(f=>f.canli);
  let ayrisan = 0, cokmus = 0;
  for (const v of VARS){
    const xs = canliF.map(f=>f.v[v]);
    const m = xs.reduce((a,b)=>a+b,0)/(xs.length||1);
    const sd = Math.sqrt(xs.reduce((a,b)=>a+(b-m)*(b-m),0)/(xs.length||1));
    if (sd >= 8) ayrisan++;
    // bir değişkende herkes aynı uçta toplanmışsa o boyut ölmüştür
    if (m <= 12 || m >= 88) cokmus++;
  }

  // Açılış canlı mı? Oyuncu ilk 60 turu oynar; dramanın orada başlaması gerek.
  const erken = w.olaylar.filter(o=>o.tur<=60);
  const erkenSayi = erken.length, erkenTip = new Set(erken.map(o=>o.tip)).size;

  // Ucuz sınavlar önce: kelebek sınavı pahalı, boşa harcama
  const ucuzGecti = canlilik>=0.30 && canlilik<=2.2 && sabitOran<=0.18 && hayatta>=4 &&
                    cesitlilik>=7 && olay>=15 && olay<=260 && olayTip>=4 &&
                    tekel<=0.55 && ayrisan>=4 && cokmus===0 &&
                    erkenSayi>=8 && erkenTip>=4;
  if (!ucuzGecti && !(ayar && ayar.tamRapor)){
    return { seed, gecti:false, canlilik:+canlilik.toFixed(3), sabitOran:+sabitOran.toFixed(3), hayatta,
             cesitlilik:+cesitlilik.toFixed(2), olay, olayTip, tekel:+tekel.toFixed(2), ayrisan, cokmus, erkenSayi, erkenTip,
             sapma:0, enSapma:0, yayilim:0, yapisal:0, erken:true };
  }

  // KELEBEK SINAVI — iki ayrı oyuncu hamlesi denenir; ikisi de dünyayı
  // yüz tur sonra yeniden yazabilmeli. Tek şanslı kaldıraç yetmez.
  function dokunus(hedefFac, hedefVar, miktar){
    const u = dunyaKur(seed, ayar);
    for (let t=0;t<DT;t++){
      if (t===20 && u.fac[hedefFac]) u.fac[hedefFac].v[hedefVar] = kirp(u.fac[hedefFac].v[hedefVar] + miktar, 0.4, 99.6);
      adim(u);
    }
    const a=dv||[], b=durumVektoru(u);
    let top=0, en=0, yay=0;
    for (let i=0;i<a.length;i++){ const d=Math.abs(a[i]-(b[i]||0)); top+=d; if(d>en) en=d; if(d>3) yay++; }
    return { ort:top/(a.length||1), en, yay: yay/(a.length||1), yapisal: yi?yapisalFark(yi,yapisalImza(u)):0 };
  }
  const d1 = dokunus(0, 'servet', 8);
  const d2 = dokunus(Math.min(2, w.fac.length-1), 'mesruiyet', -8);

  const enSapma   = Math.min(d1.en, d2.en);
  const yayilim   = Math.min(d1.yay, d2.yay);
  const yapisal   = Math.min(d1.yapisal, d2.yapisal);
  const sapma     = Math.min(d1.ort, d2.ort);

  const gecti =
    canlilik   >= 0.30 && canlilik <= 2.2 &&
    sabitOran  <= 0.18 &&
    hayatta    >= 4    &&
    cesitlilik >= 7    &&
    olay       >= 15   && olay <= 260 &&
    olayTip    >= 4    && tekel <= 0.55 &&
    ayrisan    >= 4    && cokmus === 0 &&
    erkenSayi  >= 8    && erkenTip >= 4 &&
    enSapma    >= 12   &&
    yayilim    >= 0.15 &&
    yapisal    >= 1;

  return { seed, gecti, canlilik:+canlilik.toFixed(3), sabitOran:+sabitOran.toFixed(3), hayatta,
           cesitlilik:+cesitlilik.toFixed(2), olay, olayTip, tekel:+tekel.toFixed(2), ayrisan, cokmus, erkenSayi, erkenTip,
           sapma:+sapma.toFixed(2), enSapma:+enSapma.toFixed(1), yayilim:+yayilim.toFixed(2), yapisal };
}

// Sınavı geçen ilk tohumu bul
function iyiTohum(baslangic, ayar, limit){
  limit = limit || 400;
  for (let s=baslangic>>>0; s<(baslangic>>>0)+limit; s++){
    const d = dogrula(s, ayar);
    if (d.gecti) return { seed:s, rapor:d };
  }
  return null;
}

return { VARS, VAD, SEKIL, KAPSAM, KAVRAMLAR, KATMANLAR, AMACLAR, EVRELER,
           SOZ, bilgiSeviyesi, gorunum, bolgeGorunum, gidisat, izSozu, hizSozu,
           KAYNAKLAR, dosyaUret, meseleTaramasi, MESELE_TANIM, kutuphaneEkle, SECENEK_TARIF,
           FIILLER, DOKTRINLER, hizalanma, ifsaCarpani, kanunKatkisi, kehanetDayanak, dogaKuvveti,
           oyuncuKur, hamleler, hamleYap, eliIsle, etkinlik,
           klonla, tohumEk, tohumlariIsle, meseleAc, meseleKarar, meselePencere, fraksiyonEkle, evreAdi,
           kanunSetiUret, kalibreEt, ekBelirtme, ekYonelme, durumVektoru, yapisalImza, dunyaKur, adim, skor, dogrula, iyiTohum, kanunMetni, ideolojikMesafe, mulberry32, hsh };
});

</script>
<script>
/* GİZLİ EL — arayüz. Masa, gösterge paneli değil.
 * Kural: oyuncu hak etmediği rakamı görmez. */
'use strict';
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };
const KAYIT = 'gizliel_kayit_v1';

/* Bilinmeyen yazıyla değil karalamayla gösterilir: basılmamış bir satır.
   Genişlik içeriğe göre değil, tohuma göre sabit — her açılışta aynı görünür. */
function kara(anahtar, en){
  const n = el('span','kara');
  let h = 0; for (let i=0;i<anahtar.length;i++) h = (h*31 + anahtar.charCodeAt(i)) | 0;
  const g = (en || 62) + (Math.abs(h) % 34);
  n.style.width = g + 'px';
  return n;
}
function blok(kenarMetni, doldur){
  const b = el('div','blok');
  b.appendChild(el('div','kenar', kenarMetni));
  const g = el('div','govde');
  doldur(g);
  b.appendChild(g);
  return b;
}

let W = null, aktifCekmece = 'masa', seciliBolge = null;

/* fraksiyon renkleri: soluk, mürekkep gibi */
const RENK = ['#4c5d4f','#8a5a3c','#46566e','#6f4552','#5f6b39','#3d5f60','#8a6a2c','#553f63'];
const renk = i => RENK[i % RENK.length];

/* ---------- kayıt ---------- */
function kaydet(){
  if (!W) return;
  try {
    const rng = W.kurulumRng; delete W.kurulumRng;
    localStorage.setItem(KAYIT, JSON.stringify(W));
    W.kurulumRng = rng;
  } catch(e){}
}
function kayitVar(){ try { return !!localStorage.getItem(KAYIT); } catch(e){ return false; } }
function yukle(){
  try { const s = localStorage.getItem(KAYIT); if (!s) return null; return JSON.parse(s); }
  catch(e){ return null; }
}

/* ---------- dünya arama ----------
 * Sınavı geçen dünyalar önceden bulunup listelendi (23.726 aday elenerek).
 * Böylece açılış anlık. Liste tükenirse canlı aramaya düşer. */
const OYNANAN = 'gizliel_oynanan_v1';
function oynananlar(){
  try { return JSON.parse(localStorage.getItem(OYNANAN) || '[]'); } catch(e){ return []; }
}
function oynandiIsaretle(t){
  try { const l = oynananlar(); l.push(t);
        localStorage.setItem(OYNANAN, JSON.stringify(l.slice(-400))); } catch(e){}
}

function dunyaAra(doktrin){
  $('#doktrinler').hidden = true;
  const durum = $('#arama');
  const liste = (window.TOHUMLAR || []).filter(t => oynananlar().indexOf(t) < 0);
  if (liste.length){
    const t = liste[Math.floor(Math.random()*liste.length)];
    W = GE.dunyaKur(t);
    GE.oyuncuKur(W, { doktrin });
    oynandiIsaretle(t);
    durum.textContent = 'Dünya #' + t + ' ayakta.';
    setTimeout(basla, 260);
    return;
  }
  // liste tükendi: canlı ara
  let tohum = (Date.now() ^ (Math.random()*1e9)) >>> 0, elenen = 0;
  const parti = () => {
    const t0 = performance.now();
    while (performance.now() - t0 < 26){
      const d = GE.dogrula(tohum);
      elenen++;
      if (d.gecti){
        W = GE.dunyaKur(tohum);
        GE.oyuncuKur(W, { doktrin });
        oynandiIsaretle(tohum);
        durum.textContent = elenen + ' aday elendi. Dünya ayakta.';
        setTimeout(basla, 420);
        return;
      }
      tohum = (tohum + 1) >>> 0;
    }
    durum.textContent = 'Dünya dokunuyor… ' + elenen + ' aday elendi';
    requestAnimationFrame(parti);
  };
  parti();
}

function olaySatiri(o, turGoster){

function fraksiyonSatiri(i){
  const f = W.fac[i], sv = GE.bilgiSeviyesi(W, i);
  const d = el('div','frak');
  const ad = el('div','ad');
  const sol = el('div','isim');
  const nk = el('span','nokta'); nk.style.background = renk(i);
  sol.appendChild(nk); sol.appendChild(document.createTextNode(f.ad));
  ad.appendChild(sol);
  ad.appendChild(el('div','rozet', sv === 2 ? 'ajanın var' : (sv === 1 ? 'doğasını biliyorsun' : 'kaynağın yok')));
  d.appendChild(ad);

  // Altı değişken de listelenir. Göremediklerin BOŞ değil, KARALI:
  // neyi bilmediğini de bilirsin.
  const iz = el('div','izgara');
  for (const v of GE.VARS){
    const g = GE.gorunum(W, i, v);
    const sat = el('div','sat');
    sat.appendChild(el('span','et', GE.VAD[v].toLowerCase()));
    if (g.bilinmiyor) sat.appendChild(kara(f.ad + v, 40));
    else {
      const t = (g.tam !== undefined ? g.tam + ' · ' : '') + g.soz +
        (g.gidisat && g.gidisat !== 'duruyor' ? (g.gidisat === 'artıyor' ? ' ↑' : ' ↓') : '');
      sat.appendChild(el('span','dg', t));
    }
    iz.appendChild(sat);
  }
  d.appendChild(iz);
  return d;
}

/* ---------- harita ---------- */
function haritaCiz(){
  const h = $('#harita');
  h.innerHTML = '';
  h.appendChild(el('div','not','Şema — yalnızca bildiğin kadarı. İçi dolu düğüm: içerisini görebiliyorsun.'));

  const n = W.bolgeler.length, R = 98, CX = 190, CY = 150;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 380 300');
  svg.id = 'sema';
  const poz = i => { const a = -Math.PI/2 + i/n*Math.PI*2;
    return [CX + Math.cos(a)*R, CY + Math.sin(a)*R]; };
  const kisalt = ad => ad.length > 15 ? ad.split(' ')[0] : ad;

  const cizilen = new Set();
  for (const b of W.bolgeler) for (const k of b.komsu){
    const anahtar = Math.min(b.id,k) + '-' + Math.max(b.id,k);
    if (cizilen.has(anahtar)) continue;
    cizilen.add(anahtar);
    const [x1,y1] = poz(b.id), [x2,y2] = poz(k);
    const l = document.createElementNS(ns,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke', '#9c9082');
    l.setAttribute('stroke-width', Math.abs(b.id-k)===1||Math.abs(b.id-k)===n-1 ? 1.2 : .7);
    svg.appendChild(l);
  }

  for (const b of W.bolgeler){
    const g = GE.bolgeGorunum(W, b.id);
    const [x,y] = poz(b.id);
    if (seciliBolge === b.id){
      const halka = document.createElementNS(ns,'circle');
      halka.setAttribute('cx',x); halka.setAttribute('cy',y); halka.setAttribute('r',13);
      halka.setAttribute('fill','none'); halka.setAttribute('stroke','#8c3a2b');
      halka.setAttribute('stroke-width','1');
      svg.appendChild(halka);
    }
    // ortak toprak: ikinci ince halka. Kesik çizgi gürültü yapıyordu.
    if (g.ortak){
      const dis = document.createElementNS(ns,'circle');
      dis.setAttribute('cx',x); dis.setAttribute('cy',y); dis.setAttribute('r',9.5);
      dis.setAttribute('fill','none'); dis.setAttribute('stroke', renk(g.sahip));
      dis.setAttribute('stroke-width','.6'); dis.setAttribute('opacity','.75');
      dis.style.pointerEvents = 'none';
      svg.appendChild(dis);
    }
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',6);
    // içi dolu = içerisini görebiliyorsun
    c.setAttribute('fill', g.seviye >= 1 ? renk(g.sahip) : '#e9e2d3');
    c.setAttribute('stroke', renk(g.sahip));
    c.setAttribute('stroke-width','1.5');
    c.style.pointerEvents = 'none';
    svg.appendChild(c);

    const hit = document.createElementNS(ns,'circle');
    hit.setAttribute('cx',x); hit.setAttribute('cy',y); hit.setAttribute('r',17);
    hit.setAttribute('fill','transparent');
    hit.style.cursor = 'pointer';
    hit.onclick = () => { seciliBolge = b.id; haritaCiz(); };
    svg.appendChild(hit);

    const t = document.createElementNS(ns,'text');
    const ca = Math.cos(-Math.PI/2 + b.id/n*Math.PI*2);
    const sa = Math.sin(-Math.PI/2 + b.id/n*Math.PI*2);
    const sag = ca > .18, sol = ca < -.18;
    t.setAttribute('x', x + (sag ? 14 : (sol ? -14 : 0)));
    t.setAttribute('y', y + (sag||sol ? 3 : (sa < 0 ? -14 : 17)));
    t.setAttribute('text-anchor', sag ? 'start' : (sol ? 'end' : 'middle'));
    t.textContent = kisalt(b.ad);
    svg.appendChild(t);
  }
  h.appendChild(svg);

  const bilgi = el('div','bolgeBilgi');
  if (seciliBolge === null) bilgi.innerHTML = 'Bir düğüme dokun.<br>İçi dolu düğüm: içerisini görebiliyorsun. Çift halka: ortak toprak.';
  else {
    const g = GE.bolgeGorunum(W, seciliBolge);
    const p = [];
    p.push(g.ad + ' — ' + g.sahipAd + (g.ortak ? ' · ortak toprak' : ''));
    if (g.seviye === 0) p.push('İçerisi hakkında kaynağın yok.');
    else {
      p.push('zenginlik: ' + (g.zenginlik !== undefined ? g.zenginlik + ' (' + g.zenginlikSoz + ')' : g.zenginlikSoz));
      p.push('huzursuzluk: ' + (g.huzursuzluk !== undefined ? g.huzursuzluk + ' (' + g.huzursuzlukSoz + ')' : g.huzursuzlukSoz));
      p.push('yerel kural: ' + (g.kuralVar ? 'var' : 'yok') + (g.gelenek !== undefined ? ' (gelenek ' + g.gelenek + ')' : ''));
    }
    bilgi.innerHTML = p.join('<br>');
  }
  h.appendChild(bilgi);

  // renk anahtarı: düğüm rengi sahibi gösterir
  h.appendChild(el('hr'));
  h.appendChild(blok('kim nerede', g => {
    for (let i=0;i<W.fac.length;i++){
      if (!W.fac[i].canli) continue;
      const say = W.bolgeler.filter(b => b.sahip === i).length;
      const r = el('div','olcum');
      const sol = el('span','ad');
      const nk = el('span','nokta'); nk.style.background = renk(i);
      sol.appendChild(nk); sol.appendChild(document.createTextNode(W.fac[i].ad));
      r.appendChild(sol);
      r.appendChild(el('span','nokta-sirasi'));
      r.appendChild(el('span','dg', say + ' bölge'));
      g.appendChild(r);
    }
  }));
}

/* ---------- dosya ---------- */
function dosyaAc(meseleId){
  const d = GE.dosyaUret(W, meseleId);
  if (!d) return;
  ortuAc(ic => {
    ic.appendChild(el('h2','dosyaBaslik', d.baslik));
    ic.appendChild(el('div','not','karar için ' + d.kalanMevsim + ' mevsim'));
    ic.appendChild(el('p','', d.girizgah));
    ic.appendChild(el('hr'));

    ic.appendChild(blok('tanıklıklar', g => {
      if (!d.tanikliklar.length) g.appendChild(el('p','soluk','Hiçbir kaynağın konuşmuyor.'));
      for (const t of d.tanikliklar){
        const n = el('div','taniklik');
        n.appendChild(el('div','kaynak', t.etiket));
        n.appendChild(el('div','iddia', '“' + t.metin + '”'));
        g.appendChild(n);
      }
    }));

    ic.appendChild(blok('tahminler', g => {
      for (const o of d.olcumler){
        const n = el('div','olcum');
        n.appendChild(el('span','ad', o.ad));
        n.appendChild(el('span','nokta-sirasi'));
        if (o.aralik === 'bilinmiyor'){
          const kutu = el('span','dg');
          kutu.appendChild(kara(d.baslik + o.ad, 58));
          n.appendChild(kutu);
        } else n.appendChild(el('span','dg', o.aralik));
        g.appendChild(n);
      }
      const karanlik = d.olcumler.filter(o => o.aralik === 'bilinmiyor').length;
      if (karanlik) g.appendChild(el('div','not',
        karanlik === 1 ? 'Bir satır basılmamış: kaynağın görmüyor.'
                       : karanlik + ' satır basılmamış: kaynağın oraya ulaşmıyor.'));
    }));

    if (d.celiskiler.length){
      ic.appendChild(blok('çelişki', g => {
        g.appendChild(el('p','not','İkisi aynı anda doğru olamaz.'));
        for (const c of d.celiskiler){
          const n = el('div','celiski');
          n.appendChild(el('div','not', c.baslik));
          for (const y of [c.a, c.b]){
            const q = el('div','yan');
            q.appendChild(el('div','kaynak', y.etiket));
            q.appendChild(el('div','', '“' + y.metin + '”'));
            n.appendChild(q);
          }
          g.appendChild(n);
        }
      }));
    }

    ic.appendChild(el('hr'));
    ic.appendChild(blok('kararın', g => {
      d.secenekler.forEach((sc, i) => {
        const b = el('button','secenek');
        b.appendChild(el('div','no', (i+1) + '.'));
        const sag = el('div');
        sag.appendChild(el('b','', sc.ad));
        sag.appendChild(el('span','', sc.tarif));
        b.appendChild(sag);
        b.onclick = () => {
          const olay = GE.meseleKarar(W, meseleId, sc.anahtar);
          W.olaylar.push(...olay);
          ortuKapat(); kaydet(); ciz();
        };
        g.appendChild(b);
      });
    }));
  });
}

/* ---------- emir ---------- */
const FIIL_CUMLE = {
  incele:  h => h.doga ? ['', h.fac, 'fraksiyonunun doğasını çöz'] : ['', h.kanun, 'kanununu incele'],
  ajan:    () => ['', '', 'içine ajan yerleştir'],
  fisilda: () => ['', '', 'liderinin kulağına fısılda'],
  koru:    () => ['', '', 'korunsun'],
  finanse: () => ['', '', 'gizlice finanse edilsin'],
  kiskirt: () => ['', '', 'kışkırtılsın']
};

function emirAc(){
  const hepsi = GE.hamleler(W);
  const gruplar = {};
  for (const h of hepsi) (gruplar[h.fiil] = gruplar[h.fiil] || []).push(h);
  ortuAc(ic => {
    ic.appendChild(el('h2','dosyaBaslik','Emir yaz'));
    ic.appendChild(el('div','not','nüfuz ' + Math.floor(W.el.nufuz) + ' · iz ' + GE.izSozu(W.el.ifsa)));
    ic.appendChild(el('hr'));
    const liste = el('div','sec-liste');
    for (const f in GE.FIILLER){
      const g = gruplar[f];
      if (!g || !g.length) continue;
      const F = GE.FIILLER[f];
      const b = el('button');
      b.appendChild(el('span','', F.ad));
      b.appendChild(el('span','yan', 'nüfuz ' + F.nufuz + ' · ' + g.length + ' hedef'));
      if (W.el.nufuz < F.nufuz){ b.disabled = true; b.style.opacity = .3; }
      else b.onclick = () => hedefSec(f, g);
      liste.appendChild(b);
    }
    ic.appendChild(liste);
  });
}

function ifsaSozu(x){ return x < 1.2 ? 'az' : (x < 2.6 ? 'orta' : (x < 4 ? 'çok' : 'pervasız')); }

function hedefSec(fiil, hamleler){
  ortuAc(ic => {
    ic.appendChild(el('h2','dosyaBaslik', GE.FIILLER[fiil].ad));
    ic.appendChild(el('div','not','hedefi seç'));
    ic.appendChild(el('hr'));
    const liste = el('div','sec-liste');
    const sirali = hamleler.slice().sort((a,b)=> (b.etkinlik - a.etkinlik));
    for (const h of sirali.slice(0, 120)){
      const b = el('button');
      const nt = [];
      if (h.etkinlik < 0.92) nt.push('yıpranmış ×' + h.etkinlik.toFixed(2));
      nt.push('iz ' + ifsaSozu(h.ifsa));
      b.appendChild(el('span','', h.etiket));
      b.appendChild(el('span','yan', nt.join(' · ')));
      b.onclick = () => onayla(h);
      liste.appendChild(b);
    }
    ic.appendChild(liste);
  });
}

function onayla(h){
  ortuAc(ic => {
    ic.appendChild(el('h2','dosyaBaslik','Onay'));
    ic.appendChild(el('p','', h.etiket));
    const bd = el('div','bedel');
    bd.innerHTML = 'nüfuz <b>−' + h.nufuz + '</b> &nbsp; · &nbsp; bırakacağı iz <b>' + ifsaSozu(h.ifsa) + '</b>' +
      (h.etkinlik < 0.92 ? ' &nbsp; · &nbsp; etkinlik <b>×' + h.etkinlik.toFixed(2) + '</b> (aynı kaldıraca çok bastın)' : '');
    ic.appendChild(bd);
    const ver = el('button','dugme vurgu','Emri ver');
    ver.onclick = () => {
      const olay = GE.hamleYap(W, h);
      W.olaylar.push(...olay);
      ortuKapat(); kaydet(); ciz();
    };
    ic.appendChild(ver);
  });
}

/* ---------- tur ---------- */
function mevsimGec(){
  if (W.el.bitti) return;
  // Açık dosyanın üstünden sessizce geçilmez: son mevsimde onay ister.
  const son = W.meseleler.filter(m => m.acik && GE.meselePencere(W, m) <= 1);
  if (son.length && !mevsimGec._onaylandi){
    ortuAc(ic => {
      ic.appendChild(el('h2','dosyaBaslik','Son mevsim'));
      ic.appendChild(el('p','', son.length === 1
        ? '“' + son[0].baslik + '” dosyası bu mevsim kapanıyor. Karar vermezsen karar senin yerine verilir.'
        : son.length + ' dosya bu mevsim kapanıyor. Karar vermezsen kararlar senin yerine verilir.'));
      ic.appendChild(el('p','soluk','Beklemek de bir karardır — ama bilerek bekle.'));
      const oku = el('button','dugme','Dosyayı aç');
      oku.onclick = () => { ortuKapat(); dosyaAc(son[0].id); };
      ic.appendChild(oku);
      const gec = el('button','dugme vurgu','Yine de geç');
      gec.style.marginTop = '10px';
      gec.onclick = () => { ortuKapat(); mevsimGec._onaylandi = true; mevsimGec();
                            mevsimGec._onaylandi = false; };
      ic.appendChild(gec);
    });
    return;
  }
  const oncekiAcik = W.meseleler.filter(m => m.acik).length;
  GE.adim(W);
  if (W.olaylar.length > 400) W.olaylar = W.olaylar.slice(-400);
  // yeni dosya geldiyse oyuncuyu masaya çek
  if (W.meseleler.filter(m => m.acik).length > oncekiAcik) aktifCekmece = 'masa';
  kaydet();
  ciz();
  if (W.el.bitti) sonEkrani();
}

function sonEkrani(){
  ortuAc(ic => {
    ic.appendChild(el('h2','dosyaBaslik','Görünüyorsun'));
    ic.appendChild(el('p','', W.el.bitisSebebi === 'ifsa'
      ? 'İzlerin birikti ve artık gizli değilsin. Gizli el kalmadı.'
      : 'İzini sürdüler ve buldular.'));
    ic.appendChild(el('p','soluk', W.tur + ' mevsim dayandın. Doktrinin ' +
      GE.DOKTRINLER[W.el.doktrin].ad + '; dünya sonunda ' +
      Math.round(W.el.hiz) + ' puanla ' + GE.hizSozu(W.el.hiz).toLowerCase() + '.'));
    const yeni = el('button','dugme vurgu','Yeni dünya');
    yeni.onclick = () => { try{ localStorage.removeItem(KAYIT); }catch(e){} location.reload(); };
    ic.appendChild(yeni);
  });
}

/* ---------- çizim ---------- */
function ciz(){
  durumCiz(); cekmeceCiz();
  for (const k of ['masa','harita','kronik','kutuphane']) $('#'+k).hidden = (k !== aktifCekmece);
  if (aktifCekmece === 'masa') masaCiz();
  else if (aktifCekmece === 'harita') haritaCiz();
  else if (aktifCekmece === 'kronik') kronikCiz();
  else kutuphaneCiz();
  const acik = W.meseleler.filter(m => m.acik).length;
  const g = $('#gecBtn');
  g.textContent = acik ? 'Bekle · ' + acik + ' dosya açık' : 'Mevsimi geçir';
  g.classList.toggle('vurgu', !acik);
  g.disabled = !!W.el.bitti;
  $('#emirBtn').disabled = !!W.el.bitti;
}

/* ---------- açılış ---------- */
const SURUM = '2026-09-20-2';

function girisKur(){
  const sv = $('#surum'); if (sv) sv.textContent = 'sürüm ' + SURUM;
  const d = $('#doktrinler');
  for (const k in GE.DOKTRINLER){
    const D = GE.DOKTRINLER[k];
    const b = el('button','dok');
    b.appendChild(el('b','', D.ad));
    b.appendChild(el('span','', D.tarif));
    b.onclick = () => dunyaAra(k);
    d.appendChild(b);
  }
  if (kayitVar()){
    const y = $('#yukleBtn');
    y.style.display = 'block';
    y.onclick = () => { const k = yukle(); if (k){ W = k; basla(); } };
  }
  $('#iceriAlBtn').onclick = () => {
    try { const k = JSON.parse($('#iceriAl').value); if (k && k.fac){ W = k; basla(); } }
    catch(e){ $('#arama').textContent = 'Metin okunamadı.'; }
  };
}

/* ---------- kalıcılık ve güncelleme ---------- */
// Android'de depolama baskısı altında bile veri silinmesin diye kalıcılık iste.
if (navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(v => { if (!v) navigator.storage.persist().catch(()=>{}); })
    .catch(()=>{});
}



$('#gecBtn').onclick = mevsimGec;
$('#emirBtn').onclick = emirAc;
girisKur();

</script>
